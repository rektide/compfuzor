[defaults]
action_plugins = ./library/action_plugins
filter_plugins = ./library/filter_plugins
lookup_plugins = ./library/lookup_plugins
test_plugins = ./library/test_plugins
;nocolor = 1
retry_files_enabled = False
any_errors_fatal = True
; TODO: switch ansible_* to ansible_facts['fact']
inject_facts_as_vars = True

[ssh_connection]
ssh_args = -A
pipelining = True
; setting ssh_args replaces ansible's defaults (-C -o ControlMaster=auto
; -o ControlPersist=60s), so any override silently disables multiplexing.
; alternative to pipelining: reuse one master ssh connection across tasks
;ssh_args = -A -C -o ControlMaster=auto -o ControlPersist=60s -o ControlPath=~/.ansible/cp/%C
