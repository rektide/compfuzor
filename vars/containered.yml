---
# Keep hierarchy families in one deployment tree. Override or omit individual
# entries when a family should retain its normal host path.
OPT: "{{DIR}}/opt"
SRV: "{{DIR}}/srv"
ETC: "{{DIR}}/etc"
VAR: "{{DIR}}/var"
LOG: "{{DIR}}/log"
SPOOL: "{{DIR}}/spool"
CACHE: "{{DIR}}/cache"
SRC: "{{DIR}}/src"
PID: "{{DIR}}/pid"
SHARE: "{{DIR}}/share"
