---
# Shared receiver contract for TPM-compatible managers. Other CONFIG definitions
# can coexist; producers address this one explicitly as tmux/plugins.
CONFIG_DEFINITIONS:
  tmux:
    install_owner: tmux
    configs:
      tmux-plugins.conf:
        name: plugins
        # This aggregate is entirely generated; root tmux.conf blocks are
        # managed separately. Rebuilding via block-in-file retains separator
        # whitespace after removing old blocks, causing perpetual status drift.
        processor: concat
        inputs:
          - glob: tmux-plugins.d/*.conf
            name: plugins
            remote: true
    contexts:
      user:
        scope: user
        root: config
        subpath: "tmux/compfuzor/{{NAME}}"
        install: link
