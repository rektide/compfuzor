---
# Shared compositor-neutral SteamOS session operator actions. Kept as data so
# compositor playbooks can compose these into one Compfuzor play; importing a
# second play leaks Compfuzor set_fact state (TYPE/NAME/BINS) across plays.
STEAMOS_SESSION_ACTIONS:
  - name: to-desktop.sh
    global: True
    content: |
      set -e
      _session="${1:?usage: to-desktop.sh SESSION[.desktop]}"
      case "$_session" in *.desktop) ;; *) _session="${_session}.desktop" ;; esac
      steamosctl get-valid-desktop-sessions | grep -F -- "$_session" >/dev/null || {
          echo "to-desktop: $_session is not a registered desktop session" >&2
          steamosctl get-valid-desktop-sessions >&2
          exit 1
      }
      exec steamosctl switch-to-desktop-mode "$_session"
  - name: default-desktop.sh
    global: True
    content: |
      set -e
      _session="${1:?usage: default-desktop.sh SESSION[.desktop]}"
      case "$_session" in *.desktop) ;; *) _session="${_session}.desktop" ;; esac
      steamosctl get-valid-desktop-sessions | grep -F -- "$_session" >/dev/null || {
          echo "default-desktop: $_session is not a registered desktop session" >&2
          steamosctl get-valid-desktop-sessions >&2
          exit 1
      }
      steamosctl set-default-desktop-session "$_session"
      steamosctl get-default-desktop-session
  - name: to-plasma.sh
    global: True
    content: |
      exec "${DIR}/bin/to-desktop.sh" plasma.desktop
  - name: default-plasma.sh
    global: True
    content: |
      exec "${DIR}/bin/default-desktop.sh" plasma.desktop
  - name: to-game.sh
    global: True
    content: |
      set -e
      steamosctl set-default-login-mode game
      exec steamosctl switch-to-game-mode
  - name: sessions.sh
    global: True
    content: |
      printf 'login mode:      '; steamosctl get-default-login-mode
      printf 'desktop session: '; steamosctl get-default-desktop-session
      printf 'current session: '; printf '%s\n' "${XDG_CURRENT_DESKTOP:-unknown} (${XDG_SESSION_DESKTOP:-?})"
      echo
      steamosctl get-valid-desktop-sessions
