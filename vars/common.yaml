---
# primary directories
NAME: "{{TYPE}}{{'-'+INSTANCE if INSTANCE is defined else ''}}"
TYPE: "{{ (lookup('file', '/proc/self/cmdline') | regex_replace('\u0000',' ')|ansible_cmdline).type }}"
INSTANCE_CMDLINE: "{{ (lookup('file', '/proc/self/cmdline') | regex_replace('\u0000',' ')|ansible_cmdline).instance }}"
INSTANCE: "{{ 'git' if INSTANCE_CMDLINE|def == 'src' and REPO|def is defined else 'main' }}"
BINS_DIR: "{{DIR}}/bin"
GLOBAL_BINS_DIR: /usr/local/bin
SRVS_DIR: /srv
OPTS_DIR: /opt
ETCS_DIR: /etc/opt
REPOS_DIR: /etc/opt
VARS_DIR: /var/lib
LOGS_DIR: /var/log
SPOOLS_DIR: /var/spool
CACHES_DIR: /var/cache
PIDS_DIR: /var/run
RUNS_DIR: /var/run
SRCS_DIR: /usr/local/src
ARCHIVE_SRC: "{{HOMEDIR}}/archive/{{REPO_ORG}}/{{REPO_NAME}}"
SHARES_DIR: /usr/share
PASSWORDS_DIR: "{{ETC}}/secrets"

# Archive download mode
ARCHIVE_DOWNLOAD: true
ARCHIVE_DIR: "{{HOMEDIR}}/archive"

USERMODE_BINS_DIR: "{{BINS_DIR}}"
USERMODE_ETCS_DIR: "{{HOMEDIR}}/.config"
USERMODE_CACHE_DIR: "{{XDG_CACHE_HOME}}/.cache"
USERMODE_LOCAL_DIR: "{{HOMEDIR}}/.local"
USERMODE_GLOBAL_BINS_DIR: "{{USERMODE_LOCAL_DIR}}/bin"
USERMODE_OPTS_DIR: "{{USERMODE_LOCAL_DIR}}/opt"
USERMODE_SRVS_DIR: "{{USERMODE_LOCAL_DIR}}/srv"
USERMODE_VARS_DIR: "{{USERMODE_LOCAL_DIR}}/var/lib"
USERMODE_SRCS_DIR: "{{HOMEDIR}}/src"
USERMODE_LOGS_DIR: "{{USERMODE_VARS_DIR}}/log"
USERMODE_SPOOLS_DIR: "{{USERMODE_VARS_DIR}}/spool"
USERMODE_CACHES_DIR: "{{HOMEDIR}}/.cache"
USERMODE_MEDIAS_DIR: "{{USERMODE_LOCAL_DIR}}/media"
USERMODE_SHARES_DIR: "{{USERMODE_LOCAL_DIR}}/usr/share"

REPO_DIR: "{{SRC}}"
REPO_LINK_DIR: repo
BUILD_DIR_DIR: "{{REPO_DIR}}"
BUILD_DIR: "{{BUILD_DIR_DIR}}/build"
_BUILD_DIR: "{{BUILD_DIR|defaultDir(BUILD_DIR_DIR)}}"
WORKDIR_BIN: /usr/share/doc/git/contrib/workdir/git-new-workdir
PKGCONFIG_DIR: "/usr/local/lib/pkgconfig"
PKGSS_DIR: "{{SRCS_DIR}}"
SPECS_DIR: "{{SRCS_DIR}}/spec"
SYSCTL_DIR: "/etc/sysctl.d"
WWW_LINKS_D: /etc/lighttpd2/links.d
NGINX: /etc/nginx
# package installation config
APT_INSTALL: latest
APT_BYPASS: False
APT_DEFAULT_COMPONENT: main
APT_DEFAULT_DISTRIBUTION: forky
APT_DEFAULT_ARCH: True
APT_DEFAULT_MIRROR: http://deb.debian.org/debian
APT_ARCH: amd64
UBUNTU_DISTRIBUTION: noble
TMUX_CONF_D_DIR: conf.d
BIND: 0.0.0.0
NODEJS_VERSION: 25
PNPM_VERSION: 11
BUN_VERSION: 1
GO_VERSION: 1
RUST_VERSION: 1
PYTHON_VERSION: 3
YARN_VERSION: 4
BAZEL_VERSION: 8
FLATC_VERSION: 25

DIRSET:
  - opt
  - srv
  - etc
  - var
  - log
  - spool
  - cache
  - src
  - pid
  - share
FONTS_TTF: /usr/share/fonts/truetype
MEDIAS_DIR: /srv/media
SYSTEMD_SYSTEM_UNIT_DIR: /etc/systemd/system
DIRMODE: "0770"
FILEMODE: "0660"
BINMODE: "0775"
GOPATH_DIR: "src/{{go_url|default('')|deprefix('\\w+@')|deprefix('https?://')|regex_replace('^(\\w+):', '\\1/')|trim}}"
HASH: "#"
PERSIST_VARS:
  - NAME
  - INSTANCE
  - DIR
  - PREFIX
  - USER
  - USERMODE
  - OWNER
  - APT_COMPONENT
  - APT_COMPONENTS
  - APT_TRUSTED
  - APT_SOURCELIST
  - APT_TRUST
  - APT_UPDATE_BYPASS
  - BINS
  - GLOBAL_BINS_BYPASS
  - DIR
  - DIRS
  - FILES
  - DIR_BYPASS
  - OPT_BYPASS
  - SRV_BYPASS
  - ETC_BYPASS
  - VAR_BYPASS
  - LOG_BYPASS
  - SPOOL_BYPASS
  - CACHE_BYPASS
  - SRC_BYPASS
  - PID_BYPASS
  - RUN_BYPASS
  - SHARE_BYPASS
  - LINKS
  - LINK_BYPASS
  - PKGS
  - PKGSET
  - PKGSETS
  - REPO
  - REPO_DIR
  - REPOS
  - HG_REPO
  - SVN_REPO
  - GIT_DIR
  - WITH
  - ENABLE
CA_EXPIRY: "26280h"
HOMEDIR: "/home/{{USER|default(OWNER)|default(_cf_user_id)}}"
GIT_DIR: "{{REPO_DIR|default(DIR, true)}}"
__DEST: "{{item.dest|default(item.name|default(item|default(DIR)))|defaultDir(__defaultDir|default(DIR))}}"
MULTISTRAP_COMPONENTS:
  - main
  - contrib
  - non-free
  - non-free-firmware

_ext: "{{ '.' + item.ext if item.ext|default(False) else '' }}"

# Default bin helpers — the baseline floor merged into every non-nuclear bin.
# Per-bin layers (base_helpers, helpers) union on top; see files/_bin and
# library/filter_plugins/helpers.py.
DEFAULT_HELPERS: ['env', 'setopts', 'loud']

CONFIG_EXT: conf
CONFIG_OUTPUT: "${DIR}/etc/${CONFIG_KEY}.${CONFIG_EXT}"

_binsRun: "{{ BINS_BYPASS|default(False) is falsy and BINS_RUN_BYPASS|default(False) is falsy }}"
_postRun: "{{ 'postRun' if _binsRun else 'skip' }}"

# standard subsystem evaluation contract
# data dependencies (task-local vars):
# - items: array/list of subsystem input rows
# - subsystem_name: subsystem id used for automatic bypass variable resolution
# optional task-local metadata:
# - subsystem_domain: broad domain label (for example: kernel)
# - subsystem_bypass_vars: bypass override; true enables defaults, [true, "X"] extends defaults, ["X"] replaces defaults
# optional overrides:
# - requested, bypassed, valid, errorChecks
errorChecks: []
errors: "{{ errorChecks | selectattr('failed', 'truthy') | map(attribute='msg') | list }}"
_subsystem_requested: "{{ requested | default(items | arrayitize | deflengthy, true) }}"
_subsystem_bypassed: "{{ bypassed | default(lookup('subsys', id=subsystem_name | default(''), domain=subsystem_domain | default(none), bypass=subsystem_bypass_vars | default(none), get='bypassed', default=False), true) | bool }}"
_subsystem_valid: "{{ valid | default(errors | length == 0) | bool }}"
_subsystem_active: "{{ _subsystem_requested and (not _subsystem_bypassed) and _subsystem_valid }}"

SUBSYSTEM:
  get_urls:
    requested: "{{ GET_URLS | deflengthy }}"
    spec: >-
      {%- set _items = GET_URLS | arrayitize -%}
      {%- set normalized = [] -%}
      {%- for item in _items -%}
        {%- set row = item if item is mapping else {'url': item} -%}
        {%- set url = row.url -%}
        {%- set destName = row.dest if row.dest is defined else (url | basename) -%}
        {%- set og = {} -%}
        {%- if row.owner is defined and row.owner -%}{%- set _ = og.update({'owner': row.owner}) -%}{%- endif -%}
        {%- if row.group is defined and row.group -%}{%- set _ = og.update({'group': row.group}) -%}{%- endif -%}
        {%- set entry = {'url': url, 'dest': (destName | defaultDir(SRC)), 'validate_certs': (row.validate_certs | default(VALIDATE_CERTS | default(true)))} | combine(og) -%}
        {%- set _ = normalized.append(entry) -%}
      {%- endfor -%}
      {{ normalized }}
    contrib:
      BINS:
        - name: get-urls.sh
          run: true
          generated: |
            [ -z "$DIR" ] && export DIR="{{SRC}}"
            cd "${DIR}"

            # Find and re-download from all .url files
            for urlfile in *.url; do
              [ -e "$urlfile" ] || continue
              url=$(cat "$urlfile")
              dest="${urlfile%.url}"
              echo "Fetching: $url -> $dest"
              curl -fsSL "$url" -o "$dest"
            done

  go:
    contrib:
      BINS:
        - name: build-go.sh
          bypass: ['BUILD', 'GO']
          run: "{{ BINS_RUN_BYPASS is not deftruthy }}"
          basedir: repo
          generated: |
            {% for _c in (GO_COMMENT | default([]) | arrayitize) %}
            # {{ _c }}
            {% endfor %}
            go build -o ${GO_BIN:-$TYPE} ${GO_TARGET:-./...}
        - name: install-go.sh
          bypass: ['LINK', 'GO']
          basedir: repo
          generated: |
            {% for _c in (GO_COMMENT_INSTALL | default([]) | arrayitize) %}
            # {{ _c }}
            {% endfor %}
            [ -n "${INSTALL_BIN-}" ] || INSTALL_BIN="${GO_BIN:-$TYPE}"
            ln -sfv "$(pwd)/${INSTALL_BIN}" $GLOBAL_BINS_DIR/$(basename $INSTALL_BIN)
      ENV:
        GO_BIN: "{{ GO_BIN | default(omit) }}"
        GO_TARGET: "{{ GO_TARGET | default('./...') }}"
      TOOL_VERSIONS:
        go: true

  nodejs:
    contrib:
      BINS:
        - name: build-nodejs.sh
          bypass: ['BUILD', 'NODEJS']
          run: "{{ BUILD_RUN_BYPASS is not deftruthy and BINS_RUN_BYPASS is not deftruthy }}"
          basedir: repo
          generated: |
            {% for _c in (NODEJS_COMMENT | default([]) | arrayitize) %}
            # {{ _c }}
            {% endfor %}
            if [ -f package-lock.json ] && [ ! -f pnpm-lock.yaml ]; then
              pnpm import
            fi
            pnpm i --frozen-lockfile
            IFS=',' read -ra _cf_build_scripts <<< "${NODEJS_BUILD_SCRIPTS:-build}"
            for _cf_script in "${_cf_build_scripts[@]}"; do
              if jq -e ".scripts.${_cf_script}" package.json > /dev/null 2>&1; then
                echo "Building via ${_cf_script}..."
                pnpm run "${_cf_script}"
              fi
            done
            if [ -n "${NODEJS_BUILD_COMMANDS:-}" ]; then
              IFS=',' read -ra _cf_build_commands <<< "${NODEJS_BUILD_COMMANDS:-}"
              for _cf_cmd in "${_cf_build_commands[@]}"; do
                echo "Running ${_cf_cmd}..."
                ${_cf_cmd}
              done
            fi
        - name: install-nodejs.sh
          bypass: ['LINK', 'NODEJS']
          #run: "{{ INSTALL_RUN_BYPASS is not deftruthy and BINS_RUN_BYPASS is not deftruthy }}"
          basedir: repo
          generated: |
            {% for _c in (NODEJS_COMMENT_INSTALL | default([]) | arrayitize) %}
            # {{ _c }}
            {% endfor %}
            if [ -n "{{ NODEJS_LINK_DIR | default('') }}" ]; then
              IFS=',' read -ra _cf_link_dirs <<< "{{ NODEJS_LINK_DIR | default('.') }}"
              for _cf_dir in "${_cf_link_dirs[@]}"; do
                (cd "$_cf_dir" && pnpm link -g)
              done
            else
              pnpm link -g
            fi
            if [ -n "${NODEJS_PRUNE_SCRIPTS:-}" ]; then
              IFS=',' read -ra _cf_prune_scripts <<< "${NODEJS_PRUNE_SCRIPTS:-}"
              for _cf_script in "${_cf_prune_scripts[@]}"; do
                pnpm run "${_cf_script}"
              done
            elif [ -n "${NODEJS_PRUNE_COMMANDS:-}" ]; then
              IFS=',' read -ra _cf_prune_commands <<< "${NODEJS_PRUNE_COMMANDS:-}"
              for _cf_cmd in "${_cf_prune_commands[@]}"; do
                ${_cf_cmd}
              done
            elif [ "${NODEJS_PRUNE:-}" = "true" ]; then
              pnpm prune --prod
            fi
      ENV: "{{ ({'NODEJS_BIN': NODEJS_BIN}) if NODEJS_BIN is defined else ({}) }}"
      PKGS:
        - build-essential
        - python3
      TOOL_VERSIONS:
        nodejs: true

  bun:
    contrib:
      BINS:
        - name: build-bun.sh
          bypass: ['BUILD', 'BUN']
          run: "{{ BUILD_RUN_BYPASS is not deftruthy and BINS_RUN_BYPASS is not deftruthy }}"
          basedir: repo
          generated: |
            {% for _c in (BUN_COMMENT | default([]) | arrayitize) %}
            # {{ _c }}
            {% endfor %}
            bun install
        - name: install-bun.sh
          bypass: ['LINK', 'BUN']
          run: "{{ INSTALL_RUN_BYPASS is not deftruthy and BINS_RUN_BYPASS is not deftruthy }}"
          basedir: repo
          generated: |
            {% for _c in (BUN_COMMENT_INSTALL | default([]) | arrayitize) %}
            # {{ _c }}
            {% endfor %}
            bun link -g
      ENV: "{{ ({'BUN_BIN': BUN_BIN}) if BUN_BIN is defined else ({}) }}"
      TOOL_VERSIONS:
        bun: true

  # Unified npm subsystem.
  # Default mode: global install — pnpm install -g for each package in NPM.
  # Source mode (NPM_SRC=true): download tarball, pnpm i / build / link a single package.
  # NPM can be a single package string or a list. Source mode requires a single package.
  # NPM_PACKAGE_BIN overrides the derived binary name in source mode.
  npm:
    spec:
      npm_package_bin: "{{ NPM_PACKAGE_BIN | default((NPM | default('') if NPM is string else (NPM | default([]) | first | default(''))) | regex_replace('(?:@[\\w.-]+/)?([\\w.-]+)(?:@[\\w.-]+)?', '\\1')) }}"
      npm_packages: "{{ NPM if NPM is string else (NPM | default([])) }}"
      npm_src: "{{ NPM_SRC | default(false) | bool }}"
    contrib:
      BINS: "{{ _npm_src_bins if (NPM_SRC | default(false) | bool) else _npm_install_bins }}"
      ETC_FILES: "{{ [] if (NPM_SRC | default(false) | bool) else _npm_install_etc }}"
      ENV:
        NPM_PACKAGE: "{{ NPM if NPM is string else (NPM | default(omit)) }}"
      TOOL_VERSIONS:
        nodejs: true
        pnpm: true

  rust:
    contrib:
      BINS:
        - name: build-rust.sh
          bypass: ['BUILD', 'RUST']
          run: "{{ BINS_RUN_BYPASS is not deftruthy }}"
          basedir: repo
          generated: |
            {% for _c in (RUST_COMMENT | default([]) | arrayitize) %}
            # {{ _c }}
            {% endfor %}
            if [[ -n "${RUST_PROFILE:-}" ]]; then
                PROFILE="--profile ${RUST_PROFILE}"
            elif [[ -z "${RELEASE+x}" ]]; then
                PROFILE="--release"
            elif [[ "$RELEASE" == "debug" ]]; then
                PROFILE=""
            else
                PROFILE="--${RELEASE}"
            fi
            [[ -n "${RUST_PKG:-}" ]] && PKG_FLAG="-p ${RUST_PKG}"
            [[ -n "${RUST_FEATURES:-}" ]] && FEATURES_FLAG="--features ${RUST_FEATURES}"
            if [[ -z "${RUST_LOCKED+x}" ]]; then
                [ -f Cargo.lock ] && LOCKED_FLAG="--locked" || LOCKED_FLAG=""
            elif [[ "${RUST_LOCKED}" == "true" ]]; then
                LOCKED_FLAG="--locked"
            else
                LOCKED_FLAG=""
            fi
            cargo build ${PROFILE} ${PKG_FLAG:-} ${FEATURES_FLAG:-} ${LOCKED_FLAG:-} ${RUST_CARGO_ARGS:-}
        - name: install-rust.sh
          bypass: ['LINK', 'RUST']
          basedir: repo
          generated: |
            {% for _c in (RUST_COMMENT_INSTALL | default([]) | arrayitize) %}
            # {{ _c }}
            {% endfor %}
            if [[ -n "${RUST_PROFILE:-}" ]]; then
                _target_dir="target/${RUST_PROFILE}"
            elif [[ -z "${RELEASE+x}" ]] || [[ "${RELEASE:-}" != "debug" ]]; then
                _target_dir="target/release"
            else
                _target_dir="target/debug"
            fi
            if [[ "${RUST_ALL:-}" == "true" ]]; then
                for _bin in $(cargo metadata --format-version 1 --no-deps 2>/dev/null | jq -r '[ .packages[] | .targets[] | select(.kind[] | . == "bin") | .name ] | unique[]'); do
                    ln -sfv "$(pwd)/${_target_dir}/${_bin}" "${GLOBAL_BINS_DIR}/${_bin}"
                done
            else
                [ -n "${INSTALL_BIN-}" ] || INSTALL_BIN="${RUST_BIN:-{{ TYPE }}}"
                ln -sfv "$(pwd)/${_target_dir}/${INSTALL_BIN}" "${GLOBAL_BINS_DIR}/$(basename "${INSTALL_BIN}")"
            fi
        - name: install-rust.user.sh
          bypass: ['LINK', 'RUST']
          basedir: repo
          generated: |
            if [[ -z "${RUST_LOCKED+x}" ]]; then
                [ -f Cargo.lock ] && LOCKED_FLAG="--locked" || LOCKED_FLAG=""
            elif [[ "${RUST_LOCKED}" == "true" ]]; then
                LOCKED_FLAG="--locked"
            else
                LOCKED_FLAG=""
            fi
            if grep -q '^\[workspace\]' Cargo.toml 2>/dev/null && ! grep -q '^\[package\]' Cargo.toml 2>/dev/null; then
                if [[ -n "${RUST_PKG:-}" ]]; then
                    _manifest=$(cargo metadata --format-version 1 --no-deps 2>/dev/null | jq -r --arg pkg "${RUST_PKG}" '.packages[] | select(.name == $pkg) | .manifest_path')
                    cargo install ${LOCKED_FLAG:-} --path "$(dirname "$_manifest")"
                else
                    for _manifest in $(cargo metadata --format-version 1 --no-deps 2>/dev/null | jq -r '[ .packages[] | . as $pkg | .targets[] | select(.kind[] | . == "bin") | $pkg.manifest_path ] | unique[]'); do
                        cargo install ${LOCKED_FLAG:-} --path "$(dirname "$_manifest")"
                    done
                fi
            else
                cargo install ${LOCKED_FLAG:-} --path .
            fi
      ENV: >-
        {{ (({'RUST_BIN': RUST_BIN}) if RUST_BIN is defined else {})
        | combine({'RUST_PKG': RUST_PKG} if RUST_PKG is defined else {})
        | combine({'RUST_FEATURES': RUST_FEATURES} if RUST_FEATURES is defined else {})
        | combine({'RUST_PROFILE': RUST_PROFILE} if RUST_PROFILE is defined else {})
        | combine({'RUST_CARGO_ARGS': RUST_CARGO_ARGS} if RUST_CARGO_ARGS is defined else {})
        | combine({'RUST_ALL': RUST_ALL} if RUST_ALL is defined else {})
        | combine({'RUST_LOCKED': RUST_LOCKED} if RUST_LOCKED is defined else {}) }}
      PKGS: "{{ RUST_PKGS | default([]) }}"
      TOOL_VERSIONS:
        rust: true

  bazel:
    requested: "{{ BAZEL is deftruthy }}"
    contrib:
      BINS: "{{ _bazel_bins }}"
      TOOL_VERSIONS:
        bazel: true

  cmake:
    requested: "{{ CMAKE is deftruthy or CMAKE_ARGS is defined or CMAKE_BUILDS is defined }}"
    contrib:
      BINS: "{{ _cmake_bins }}"
      PKGS: [cmake, ninja-build]
      ENV: "{{ _cmake_env }}"
      ENV_PRIO: "{{ _cmake_deps_env_prio }}"

  make:
    requested: "{{ MAKE is deftruthy or MAKE_AUTOCONF is deftruthy }}"
    contrib:
      BINS: "{{ _make_bins }}"

  python:
    requested: "{{ PYTHON is deftruthy or PIP is defined }}"
    contrib:
      BINS:
        - name: build-python.sh
          bypass: ['BUILD', 'PYTHON']
          run: "{{ BINS_RUN_BYPASS is not deftruthy }}"
          basedir: repo
          generated: |
            {% for _c in (PYTHON_COMMENT | default([]) | arrayitize) %}
            # {{ _c }}
            {% endfor %}
            {% if PYTHON_BUILD_COMMAND is defined %}
            {{ PYTHON_BUILD_COMMAND }}
            {% else %}
            [ -d .venv ] || uv venv
            {% if PIP is defined %}
            uv pip install -r etc/pip.txt
            {% else %}
            if [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ]; then
              uv pip install -e .
            elif [ -f requirements.txt ]; then
              uv pip install -r requirements.txt
            fi
            {% endif %}
            source {{ DIR }}/bin/venv.source
            {% endif %}
        - name: venv.source
          basedir: repo
          generated: |
            . "$(pwd)/.venv/bin/activate"
      ENV: "{{ (({'PYTHON_BIN': PYTHON_BIN}) if PYTHON_BIN is defined else {}) | combine({} if ENV | def(True) == True else ENV) }}"
      ETC_FILES: "{{ [{'name': 'pip.txt', 'content': (PIP | join('\\n') if PIP is iterable and PIP is not string else PIP | default(''))}] if PIP is defined else [] }}"
      TOOL_VERSIONS:
        python: true

  desktop:
    requested: "{{ DESKTOP is defined }}"
    contrib:
      BINS:
        - name: install-desktop.sh
          generated: |
            {% for _c in (DESKTOP_COMMENT | default([]) | arrayitize) %}
            # {{ _c }}
            {% endfor %}
            {% for entry in (DESKTOP | arrayitize) %}
            {% set df = entry.desktop_file %}
            {% set exec_val = entry.exec | default('') %}
            {% set icon_val = entry.icon | default('') %}
            {% set set_path = entry.path | default(false) | bool %}
            mkdir -p $HOME/.local/share/applications
            desktop-file-install \
              --dir="$HOME/.local/share/applications" \
            {%- if exec_val %}
              --set-key=Exec --set-value="{{ exec_val }}" \
            {%- endif %}
            {%- if icon_val %}
              --set-key=Icon --set-value="$REPO_DIR/{{ icon_val }}" \
            {%- endif %}
            {%- if set_path %}
              --set-key=Path --set-value="$REPO_DIR" \
            {%- endif %}
              "$REPO_DIR/{{ df }}"
            {% endfor %}
      PKGS: [desktop-file-utils]

  patches:
    requested: "{{ PR_PATCHES is defined and PR_PATCHES | length > 0 }}"
    spec: "{{ _pr_patches_spec }}"
    contrib:
      ETC_FILES:
        - name: patches.json
          content: "{{ _pr_patches_spec | to_nice_json }}"
      BINS:
        - name: download-patches.sh
          generated: |
            {% for _c in (PATCHES_COMMENT | default([]) | arrayitize) %}
            # {{ _c }}
            {% endfor %}
            PATCHES_DIR="${DIR}/patches"
            mkdir -p "$PATCHES_DIR"

            _download_one() {
              local index="$1" url="$2" slug="$3" patch_file="$4"
              local dest="$PATCHES_DIR/$patch_file"

              if [ -f "$dest" ]; then
                echo "Already downloaded: $dest"
                return 0
              fi

              echo "Downloading patch $index ($slug)..."
              curl -fsSL "${url}.patch" -o "$dest" || { echo "failed to download patch $index" >&2; return 1; }

              local pr_num
              pr_num=$(echo "$url" | grep -oP '/pull/\K\d+')
              if [ -n "$pr_num" ]; then
                local api_url
                api_url=$(echo "$url" | sed -E 's|^(https://github\.com)/([^/]+)/([^/]+)/pull/([0-9]+).*|\1/api/repos/\2/\3/pulls/\4|')
                if [ -n "$api_url" ]; then
                  curl -fsSL "$api_url" -o "${dest%.patch}.pr.json" 2>/dev/null \
                    || echo "could not fetch PR metadata for $slug (non-terminal)" >&2
                fi
              fi
            }

            if [ ! -f "$PATCHES_JSON" ]; then
              echo "patches.json not found at $PATCHES_JSON" >&2
              exit 1
            fi

            if [ -n "${1:-}" ]; then
              entry=$(jq -c --argjson idx "$1" '.[] | select(.index == $idx)' "$PATCHES_JSON")
              if [ -z "$entry" ]; then
                max=$(jq '.[-1].index' "$PATCHES_JSON")
                echo "Unknown patch index: $1. Valid: 1-$max" >&2
                exit 1
              fi
              _download_one \
                "$(echo "$entry" | jq -r '.index')" \
                "$(echo "$entry" | jq -r '.url')" \
                "$(echo "$entry" | jq -r '.slug')" \
                "$(echo "$entry" | jq -r '.patch_file')"
            else
              while IFS= read -r entry; do
                _download_one \
                  "$(echo "$entry" | jq -r '.index')" \
                  "$(echo "$entry" | jq -r '.url')" \
                  "$(echo "$entry" | jq -r '.slug')" \
                  "$(echo "$entry" | jq -r '.patch_file')"
              done < <(jq -c '.[]' "$PATCHES_JSON")
            fi
        - name: apply-patches.sh
          basedir: repo
          generated: |
            {% for _c in (PATCHES_COMMENT_APPLY | default([]) | arrayitize) %}
            # {{ _c }}
            {% endfor %}
            PATCHES_DIR="${DIR}/patches"

            if [ ! -d "$PATCHES_DIR" ]; then
              echo "No patches directory found. Run download-patches.sh first."
              exit 1
            fi

            shopt -s nullglob
            patches=("$PATCHES_DIR"/*.patch)
            if [ ${#patches[@]} -eq 0 ]; then
              echo "No patches found in $PATCHES_DIR"
              exit 0
            fi

            for patch_file in "${patches[@]}"; do
              echo "Applying $(basename "$patch_file")..."
              git am "$patch_file" || {
                echo "Failed to apply $(basename "$patch_file"). Aborting."
                git am --abort 2>/dev/null
                exit 1
              }
            done
            echo "All ${#patches[@]} patch(es) applied successfully."
      ENV:
        PATCHES_JSON: "{{ DIR }}/etc/patches.json"
      ENV_LIST: [PATCHES_JSON]

  config:
    requested: "{{ CONFIG_KEY is defined }}"
    contrib:
      ETC_DIRS:
        - "{{ CONFIG_KEY }}"
        - "{{ CONFIG_KEY }}-disabled"
      BINS:
        - name: "config-{{ CONFIG_KEY }}.sh"
          src: "../config-{{ CONFIG_MERGE | default('yaml-list') }}.sh"
          basedir: False
        - name: "disable-{{ CONFIG_KEY }}.sh"
          src: ../config-disable.sh
          basedir: False
        - name: "enable-{{ CONFIG_KEY }}.sh"
          src: ../config-enable.sh
          basedir: False
        - name: status-config.sh
          src: ../status/status-config.sh
          basedir: False
      ENV_LIST: [CONFIG_KEY, CONFIG_EXT, CONFIG_OUTPUT]

  kernel_modprobe:
    requested: "{{ KERNEL_MODULES is defmapping and KERNEL_MODULES | deflengthy }}"
    contrib:
      ETC_FILES:
        - name: kernel.modules.json
          content: "{{ KERNEL_MODULES | to_nice_json }}"
      BINS: "{{ _kernel_modprobe_bins }}"
      ENV:
        KERNEL_MODULES_JSON: "{{ DIR }}/etc/kernel.modules.json"
      ENV_LIST: [KERNEL_MODULES_JSON]
      PKGS: [jq]

  # kernel_sysctl -- manages sysctls declared via KERNEL_SYSCTL (mapping of full
  # dotted path -> value). build-sysctl.sh emits "<key> = <value>" to
  # /etc/sysctl.d/<NAME>.conf; apply-sysctl.sh sets them live; status-sysctl.ts
  # reports drift. Common guest: `kernel.panic` (panic->reboot timeout) -- declare
  # it wherever crash-testability matters (pstore/ramoops, kdump) so a panic
  # auto-reboots instead of hanging, and so status flags a regression to 0. Some
  # sysctls (kernel.panic included) also accept a cmdline token (`panic=N`) via
  # KERNEL_PARAMS as a boot-floor; prefer KERNEL_SYSCTL for live tunability +
  # drift reporting, and add the cmdline token only if you want it set before any
  # apply runs.
  kernel_sysctl:
    requested: "{{ KERNEL_SYSCTL is defmapping and KERNEL_SYSCTL | deflengthy }}"
    contrib:
      ETC_FILES:
        - name: kernel.sysctl.json
          content: "{{ KERNEL_SYSCTL | to_nice_json }}"
      BINS: "{{ _kernel_sysctl_bins }}"
      ENV:
        KERNEL_SYSCTL_JSON: "{{ DIR }}/etc/kernel.sysctl.json"
      ENV_LIST: [KERNEL_SYSCTL_JSON]
      PKGS: [jq]

  kernel_sysfs:
    requested: "{{ KERNEL_SYSFS is defmapping and KERNEL_SYSFS | deflengthy }}"
    contrib:
      ETC_FILES:
        - name: kernel.sysfs.json
          content: "{{ KERNEL_SYSFS | to_nice_json }}"
      BINS: "{{ _kernel_sysfs_bins }}"
      ENV:
        KERNEL_SYSFS_JSON: "{{ DIR }}/etc/kernel.sysfs.json"
      ENV_LIST: [KERNEL_SYSFS_JSON]
      PKGS: [jq]

  kernel_params:
    # Raw kernel cmdline tokens that don't fit the <module>.<param>=<value>
    # shape KERNEL_MODULES uses (e.g. memmap=256K$0x100000000, nospectre_v2,
    # rootflags=...). install-kernel-params.sh writes them to /etc/kernel/cmdline
    # idempotently: key=value tokens are replaced by key prefix, flag-style
    # tokens (no =) are added once.
    requested: "{{ KERNEL_PARAMS is sequence and KERNEL_PARAMS | deflengthy }}"
    contrib:
      ETC_FILES:
        - name: kernel.params.json
          content: "{{ KERNEL_PARAMS | default([]) | to_nice_json }}"
      BINS: "{{ _kernel_params_bins }}"
      ENV:
        KERNEL_PARAMS_JSON: "{{ DIR }}/etc/kernel.params.json"
      ENV_LIST: [KERNEL_PARAMS_JSON]
      PKGS: [jq]

  kernel_bls:
    # Regenerate systemd-boot BLS entries after the cmdline-writing kernel
    # subsys (kernel_modprobe / kernel_params) update /etc/kernel/cmdline.
    # Active exactly when either of those is, since either writes the cmdline
    # that kernel-install propagates to the ESP. install-kernel-bls.sh runs last
    # (see _kernel_bls_bins + gen_kernel merge order) and is gated at runtime by
    # KERNEL_INSTALL (default off -> warn) so the cmdline->BLS gap is visible.
    requested: "{{ (KERNEL_MODULES is defmapping and KERNEL_MODULES | deflengthy) or (KERNEL_PARAMS is sequence and KERNEL_PARAMS | deflengthy) }}"
    contrib:
      BINS: "{{ _kernel_bls_bins }}"

  readme:
    requested: "{{ README is defined }}"
    contrib:
      ETC_FILES:
        - name: README.md
          destTemplate: "{{DIR}}/README.md"
          content: "{{ README }}"

  status:
    # requested when dir dumps are declared, or any subsystem contributed a
    # reporter to STATUSES (gen_kernel appends status-sysctl.ts /
    # status-modules.ts / status-sysfs.ts for active kernel leaves).
    requested: "{{ (STATUS_DIRS is deftruthy) or (STATUS_DIRS_SUDO is deftruthy) or ((STATUSES | default([])) | length > 0) }}"
    contrib:
      BINS: "{{ [ {'name': 'status.sh', 'src': '../status/status.sh', 'basedir': false} ] + ([ {'name': 'status-dirs.sh', 'src': '../status/status-dirs.sh', 'basedir': false} ] if (STATUS_DIRS is deftruthy or STATUS_DIRS_SUDO is deftruthy) else []) }}"
      ENV:
        STATUS_DIRS: "{{ STATUS_DIRS | default([]) | arrayitize | join(':') }}"
        STATUS_DIRS_SUDO: "{{ STATUS_DIRS_SUDO | default([]) | arrayitize | join(':') }}"

  # Vars-phase subsystem (NOT a gen_* one): a service declares SYSTEMD_ENV
  # (mapping of VAR -> value) to publish those vars to the systemd manager on
  # start and clear them on stop. vars_systemd_env.tasks injects
  # ExecStartPost/ExecStop into SYSTEMD_SERVICES, so it MUST run before
  # vars_systemd_unit.tasks freezes the unit ETC_FILES -- which the gen_* phase
  # comes too late for. Registered here purely for active/bypass/status parity
  # (lookup('subsys', id='systemd_env')); bypass via SYSTEMD_ENV_BYPASS.
  systemd_env:
    requested: "{{ SYSTEMD_ENV is mapping and (SYSTEMD_ENV | length > 0) }}"

_pr_patches_raw: "{{ PR_PATCHES | default([]) | arrayitize }}"
_pr_patches_spec: >-
  {%- set normalized = [] -%}
  {%- for entry in _pr_patches_raw -%}
    {%- set row = entry if entry is mapping else {'url': entry} -%}
    {%- set url = row.url -%}
    {%- set pr_num = url | regex_replace('.*/pull/(\\d+)$', '\\1') -%}
    {%- set slug = row.name | default(pr_num) -%}
    {%- set _ = normalized.append({'index': loop.index, 'url': url, 'slug': slug, 'pr_num': pr_num}) -%}
  {%- endfor -%}
  {{ normalized }}

_nodejs_build_scripts: "{{ (NODEJS_BUILD_SCRIPTS | default(NODEJS_BUILD_SCRIPT | default([]))) | arrayitize }}"
_nodejs_build_commands: "{{ (NODEJS_BUILD_COMMANDS | default(NODEJS_BUILD_COMMAND | default([]))) | arrayitize }}"
_nodejs_prune_scripts: "{{ (NODEJS_PRUNE_SCRIPTS | default(NODEJS_PRUNE_SCRIPT | default([]))) | arrayitize }}"
_nodejs_prune_commands: "{{ (NODEJS_PRUNE_COMMANDS | default(NODEJS_PRUNE_COMMAND | default([]))) | arrayitize }}"

_npm_src_bins:
  - name: build-npm.sh
    generated: |
      {% for _c in (NPM_COMMENT | default([]) | arrayitize) %}
      # {{ _c }}
      {% endfor %}
      curl $(npm view $NPM_PACKAGE dist.tarball) | tar -xz --strip-components=1
      pnpm i
      IFS=',' read -ra _cf_build_scripts <<< "${NODEJS_BUILD_SCRIPTS:-build}"
      for _cf_script in "${_cf_build_scripts[@]}"; do
        if jq -e ".scripts.${_cf_script}" package.json > /dev/null 2>&1; then
          echo "Building via ${_cf_script}..."
          pnpm run "${_cf_script}"
        fi
      done
      if [ -n "${NODEJS_BUILD_COMMANDS:-}" ]; then
        IFS=',' read -ra _cf_build_commands <<< "${NODEJS_BUILD_COMMANDS:-}"
        for _cf_cmd in "${_cf_build_commands[@]}"; do
          echo "Running ${_cf_cmd}..."
          ${_cf_cmd}
        done
      fi
      pnpm link

_npm_install_bins:
  - name: install-npm.sh
    run: "{{ INSTALL_RUN_BYPASS is not deftruthy and BINS_RUN_BYPASS is not deftruthy }}"
    generated: |
      {% for _c in (NPM_COMMENT_INSTALL | default([]) | arrayitize) %}
      # {{ _c }}
      {% endfor %}
      pnpm install -g{% set _ab = NPM_ALLOW_BUILD | default(False) %}{% if _ab %}{% for _pkg in ((NPM | arrayitize) if (_ab | type_debug == 'bool') else (_ab | arrayitize)) %} --allow-build={{ _pkg }}{% endfor %}{% endif %} $(cat etc/npm.txt) $*

_npm_install_etc:
  - name: npm.txt
    content: |
      {{ NPM | arrayitize | join('\n') }}

_bazel_target: "{{ BAZEL_TARGET | default('//...') }}"
_bazel_bins:
  - name: build-bazel.sh
    bypass: ['BUILD', 'BAZEL']
    run: "{{ BINS_RUN_BYPASS is not deftruthy }}"
    basedir: repo
    generated: |
      {% for _c in (BAZEL_COMMENT | default([]) | arrayitize) %}
      # {{ _c }}
      {% endfor %}
      bazel build {{ _bazel_target }}
  - name: install-bazel.sh
    bypass: ['LINK', 'BAZEL']
    basedir: repo
    generated: |
      {% for _c in (BAZEL_COMMENT_INSTALL | default([]) | arrayitize) %}
      # {{ _c }}
      {% endfor %}
      {% if BAZEL_INSTALL_TARGETS is defined %}
      {% for target in BAZEL_INSTALL_TARGETS %}
      bin_path="$(bazel info bazel-bin)/{{ target }}"
      ln -sfv "$bin_path" $GLOBAL_BINS_DIR/$(basename "$bin_path")
      {% endfor %}
      {% else %}
      [ -n "${INSTALL_BIN-}" ] || INSTALL_BIN="${BAZEL_BIN:-{{ TYPE }}}"
      bin_path="$(bazel info bazel-bin)/${INSTALL_BIN}"
      ln -sfv "$bin_path" $GLOBAL_BINS_DIR/$(basename "$bin_path")
      {% endif %}

_cmake_source_default: "{{ CMAKE_SOURCE_DIR | default('.') }}"
_cmake_builds_raw: "{{ CMAKE_BUILDS | arrayitize }}"
_cmake_default_build:
  name: default
  build_dir: "{{ _BUILD_DIR }}"
  source_dir: "{{ _cmake_source_default }}"
  generator: "{{ CMAKE_GENERATOR | default('Ninja') }}"
  args: "{{ CMAKE_ARGS | default('') }}"
  build_type: "{{ CMAKE_BUILD_TYPE | default('Release') }}"
  configure_always: "{{ CMAKE_CONFIGURE_ALWAYS | default(False) }}"
  install: "{{ CMAKE_INSTALL is defined }}"
_cmake_builds: "{{ _cmake_builds_raw if _cmake_builds_raw | deflengthy else [_cmake_default_build] }}"
_cmake_install_args_global: >-
  {{
    CMAKE_INSTALL | arrayitize | join(' ')
    if (CMAKE_INSTALL is defined and CMAKE_INSTALL != True)
    else ''
  }}
_cmake_libdir: "{{ CMAKE_LIBDIR | default('/lib/cmake') }}"
_cmake_deps_env_prio: >-
  {%- set out = {} -%}
  {%- for dep, path in (CMAKE_DEPS | default({})).items() -%}
  {%- set _ = out.update({ (dep | upper) ~ '_DIR': path }) -%}
  {%- endfor -%}
  {{ out }}
_cmake_deps_env: >-
  {%- set out = {} -%}
  {%- for dep, path in (CMAKE_DEPS | default({})).items() -%}
  {%- set _ = out.update({ (dep | upper) ~ '_CMAKE': '${' ~ (dep | upper) ~ '_DIR}' ~ _cmake_libdir ~ '/' ~ dep }) -%}
  {%- endfor -%}
  {{ out }}
_cmake_dep_args: >-
  {%- set args = [] -%}
  {%- for dep in (CMAKE_DEPS | default({})) -%}
  {%- set _ = args.append('-D' ~ dep ~ '_DIR="${' ~ (dep | upper) ~ '_CMAKE}"') -%}
  {%- endfor -%}
  {{ args | join(' ') }}
_cmake_install_prefix_arg: >-
  {%- if CMAKE_INSTALL_PREFIX is defined -%}
  {%- if CMAKE_INSTALL_PREFIX | string | lower in ['true', '1'] -%}
  -DCMAKE_INSTALL_PREFIX="${DIR}"
  {%- else -%}
  -DCMAKE_INSTALL_PREFIX={{ CMAKE_INSTALL_PREFIX }}
  {%- endif -%}
  {%- endif -%}
_cmake_policy_version_arg: >-
  {{ '' if (CMAKE_POLICY_VERSION_MINIMUM | default('3.10') | string | lower in ['false', '0', 'no', 'none', '']) else '-DCMAKE_POLICY_VERSION_MINIMUM=' ~ (CMAKE_POLICY_VERSION_MINIMUM | default('3.10')) }}
_cmake_env_base:
  BUILD_DIR_CF_CM: "{{ _BUILD_DIR }}"
  CMAKE_GENERATOR: "{{ CMAKE_GENERATOR | default(omit) }}"
  CMAKE_BUILD_TYPE: "{{ CMAKE_BUILD_TYPE | default('Release') }}"
  CMAKE_INSTALL_BIN: "{{ CMAKE_INSTALL_BIN | default(omit) }}"
_cmake_env: "{{ _cmake_env_base | combine(_cmake_deps_env) }}"
_cmake_bins:
  - name: build-cmake.sh
    bypass: ['BUILD', 'CMAKE']
    run: "{{ BINS_RUN_BYPASS is not deftruthy }}"
    basedir: "{{ REPO_DIR }}"
    generated: |
      {% for _c in (CMAKE_COMMENT | default([]) | arrayitize) %}
      # {{ _c }}
      {% endfor %}
      {% for cmakeBuild in _cmake_builds %}
      {% set generator = cmakeBuild.generator | default(CMAKE_GENERATOR | default('Ninja')) %}
      {% set configureArgs = cmakeBuild.args | default(CMAKE_ARGS | default([])) | arrayitize | join(' ') %}
      {% set buildTarget = cmakeBuild.build_target | default(CMAKE_BUILD_TARGET | default(False)) %}
      {% set buildType = cmakeBuild.build_type | default(CMAKE_BUILD_TYPE | default(False)) %}
      {% set buildArgs = cmakeBuild.build_args | default(CMAKE_BUILD_ARGS | default([])) | arrayitize | join(' ') %}
      echo "CMake build: {{ cmakeBuild.name | default('default') }}"

      BUILD_DIR="{{ cmakeBuild.build_dir | default(_BUILD_DIR) }}"
      SOURCE_DIR="{{ cmakeBuild.source_dir | default(_cmake_source_default) }}"
      CONFIGURE_STATE="$BUILD_DIR/.compfuzor-cmake-configure.txt"
      CONFIGURE_STATE_NEXT="$BUILD_DIR/.compfuzor-cmake-configure.next.txt"
      SHOULD_CONFIGURE=0

      mkdir -p "$BUILD_DIR"

      cat > "$CONFIGURE_STATE_NEXT" <<'EOF'
      generator={{ generator }}
      source_dir={{ cmakeBuild.source_dir | default(_cmake_source_default) }}
      args:
      {{ configureArgs | trim }}
      EOF

      {% if cmakeBuild.configure_always | default(CMAKE_CONFIGURE_ALWAYS | default(False)) | bool %}
      SHOULD_CONFIGURE=1
      {% else %}
      if [ ! -f "$BUILD_DIR/CMakeCache.txt" ]; then
        SHOULD_CONFIGURE=1
      elif [ ! -f "$CONFIGURE_STATE" ]; then
        # cache exists but no compfuzor state -> a prior configure was incomplete
        # (e.g. cmake failed); clear stale artifacts so configure starts fresh
        rm -rf "$BUILD_DIR/CMakeCache.txt" "$BUILD_DIR/CMakeFiles"
        SHOULD_CONFIGURE=1
      elif cmp -s "$CONFIGURE_STATE" "$CONFIGURE_STATE_NEXT"; then
        rm -f "$CONFIGURE_STATE_NEXT"
      else
        SHOULD_CONFIGURE=1
      fi
      {% endif %}

      if [ "$SHOULD_CONFIGURE" -eq 1 ]; then
        cmake -G "{{ generator }}" -B "$BUILD_DIR" -S "$SOURCE_DIR" {{ [_cmake_dep_args, _cmake_install_prefix_arg, _cmake_policy_version_arg, configureArgs] | select('ne', '') | join(' ') }}
        mv "$CONFIGURE_STATE_NEXT" "$CONFIGURE_STATE"
      else
        echo "Already configured, skipping configure for $BUILD_DIR"
      fi

      cmake --build "$BUILD_DIR"{% if buildTarget %} --target {{ buildTarget }}{% endif %}{% if buildType %} --config {{ buildType }}{% endif %}{% if buildArgs %} {{ buildArgs }}{% endif %}
      {% endfor %}
  - name: install-cmake.sh
    bypass: ['LINK', 'CMAKE']
    basedir: repo
    generated: |
      {% for _c in (CMAKE_COMMENT_INSTALL | default([]) | arrayitize) %}
      # {{ _c }}
      {% endfor %}
      {% if CMAKE_INSTALL is defined %}
      {% for cmakeBuild in _cmake_builds if cmakeBuild.install | default(True) %}
      {% set installArgs = cmakeBuild.install_args | arrayitize | join(' ') %}
      cmake --install "{{ cmakeBuild.build_dir | default(_BUILD_DIR) }}"{{ ' ' + _cmake_install_args_global if _cmake_install_args_global else '' }}{{ ' ' + installArgs if installArgs else '' }}
      {% endfor %}
      {% else %}
      [ -n "${INSTALL_BIN-}" ] || INSTALL_BIN="${CMAKE_INSTALL_BIN:-{{ TYPE }}}"
      ln -sfv "$(pwd)/{{ _cmake_builds[0].build_dir | default('build') }}/${INSTALL_BIN}" $GLOBAL_BINS_DIR/$(basename $INSTALL_BIN)
      {% endif %}

_make_prefix_arg: >-
  {%- if MAKE_INSTALL_PREFIX is defined -%}
  {%- if MAKE_INSTALL_PREFIX | string | lower in ['true', '1'] -%}
  --prefix="${DIR}"
  {%- else -%}
  --prefix={{ MAKE_INSTALL_PREFIX }}
  {%- endif -%}
  {%- endif -%}
_make_destdir_arg: >-
  {%- if MAKE_DESTDIR is defined -%}
  {%- if MAKE_DESTDIR | string | lower in ['true', '1'] -%}
  DESTDIR="${DIR}/var/dest"
  {%- else -%}
  DESTDIR={{ MAKE_DESTDIR }}
