---
# primary directories
NAME: "{{TYPE}}{{'-'+INSTANCE if INSTANCE is defined else ''}}"
TYPE: "{{ (lookup('file', '/proc/self/cmdline') | regex_replace('\u0000',' ')|ansible_cmdline).type }}"
INSTANCE_CMDLINE: "{{ (lookup('file', '/proc/self/cmdline') | regex_replace('\u0000',' ')|ansible_cmdline).instance }}"
INSTANCE: "{{ 'git' if INSTANCE_CMDLINE|def == 'src' and REPO|def is defined else 'main' }}"
BINS_DIR: "{{DIR}}/bin"
GLOBAL_BINS_DIR: /usr/local/bin
SRVS_DIR: /srv
OPTS_DIR: /opt
ETCS_DIR: /etc/opt
REPOS_DIR: /etc/opt
VARS_DIR: /var/lib
SYSUSERSDIR: /etc/sysusers.d
LOGS_DIR: /var/log
SPOOLS_DIR: /var/spool
CACHES_DIR: /var/cache
PIDS_DIR: /var/run
RUNS_DIR: /var/run
SRCS_DIR: /usr/local/src
ARCHIVE_SRC: "{{HOMEDIR}}/archive/{{REPO_ORG}}/{{REPO_NAME}}"
# Canonical host compfuzor checkout (house archive convention; not yet
# guaranteed to exist). The repo_jj_archive runner prefers this checkout's
# launcher when present so archive refreshes use the freshest toolkit
# regardless of which checkout renders the playbook; the executing
# playbook's launcher remains the always-available fallback and
# COMPFUZOR_REPO_JJ_RUNNER overrides both. Keep the rektide/compfuzor shape:
# the opt-in self-freshen derives --archive-dir from its dirname.
COMPFUZOR_ARCHIVE: "{{ARCHIVE_DIR}}/rektide/compfuzor"
SHARES_DIR: /usr/share
PASSWORDS_DIR: "{{ETC}}/secrets"

# Canonical watcher endpoint — the one contract shared by watchman.srv.pb,
# watchwoman.src.pb, and opencode.src.pb. Watchman's
# WATCHMAN_USE_XDG_STATE_HOME default is the path contract:
# ${XDG_STATE_HOME:-$HOME/.local/state}/watchman/<user>-state/sock.
# Unit names: the socket is the public endpoint and carries the classic
# name; the active daemon unit is implementation-named with a classic-name
# alias; the C++ fallback is implementation-named outright.
WATCHMAN_SOCKET_UNIT: watchman
WATCHMAN_SERVICE_UNIT: watchwoman
WATCHMAN_SERVICE_ALIAS_UNIT: watchman
WATCHMAN_FALLBACK_UNIT: watchman-facebook
# Runtime-root spellings for links.mjs plans and env.export (expanded at
# apply/source time; keep ${XDG_STATE_HOME} unexpanded so both roots work).
WATCHMAN_CANONICAL_STATE: "${XDG_STATE_HOME}/watchman/{{ansible_user_id}}-state"
WATCHMAN_CANONICAL_SOCKET: "{{WATCHMAN_CANONICAL_STATE}}/sock"
WATCHMAN_MAIN_SOCKET: "${HOME}/.local/var/lib/watchman-main/sock"
WATCHMAN_DEFAULT_PREFIX: /usr/local/var/run/watchman
WATCHMAN_DEFAULT_STATE_DIR: /usr/local/src/watchman-git/watchman/var/run/watchman
# Absolute spelling for consumers that cannot expand at runtime (systemd
# EnvironmentFile never expands shell variables).
WATCHMAN_CANONICAL_SOCKET_ABS: "{{ ansible_env.XDG_STATE_HOME | default(ansible_user_dir ~ '/.local/state', true) }}/watchman/{{ ansible_user_id }}-state/sock"

# Archive download mode
ARCHIVE_DOWNLOAD: true
ARCHIVE_DIR: "{{HOMEDIR}}/archive"

USERMODE_BINS_DIR: "{{BINS_DIR}}"
USERMODE_ETCS_DIR: "{{HOMEDIR}}/.config"
USERMODE_CACHE_DIR: "{{HOMEDIR}}/.cache"
USERMODE_LOCAL_DIR: "{{HOMEDIR}}/.local"
USERMODE_GLOBAL_BINS_DIR: "{{USERMODE_LOCAL_DIR}}/bin"
USERMODE_OPTS_DIR: "{{USERMODE_LOCAL_DIR}}/opt"
USERMODE_SRVS_DIR: "{{USERMODE_LOCAL_DIR}}/srv"
USERMODE_VARS_DIR: "{{USERMODE_LOCAL_DIR}}/var/lib"
USERMODE_SRCS_DIR: "{{HOMEDIR}}/src"
USERMODE_LOGS_DIR: "{{USERMODE_LOCAL_DIR}}/var/log"
USERMODE_SPOOLS_DIR: "{{USERMODE_LOCAL_DIR}}/var/spool"
USERMODE_CACHES_DIR: "{{HOMEDIR}}/.cache"
USERMODE_MEDIAS_DIR: "{{USERMODE_LOCAL_DIR}}/media"
USERMODE_SHARES_DIR: "{{USERMODE_LOCAL_DIR}}/usr/share"

REPO_DIR: "{{SRC}}"
REPO_LINK_DIR: repo
BUILD_DIR_DIR: "{{REPO_DIR}}"
BUILD_DIR: "{{BUILD_DIR_DIR}}/build"
_BUILD_DIR: "{{BUILD_DIR|defaultDir(BUILD_DIR_DIR)}}"
WORKDIR_BIN: /usr/share/doc/git/contrib/workdir/git-new-workdir
PKGCONFIG_DIR: "/usr/local/lib/pkgconfig"
PKGSS_DIR: "{{SRCS_DIR}}"
SPECS_DIR: "{{SRCS_DIR}}/spec"
SYSCTL_DIR: "/etc/sysctl.d"
WWW_LINKS_D: /etc/lighttpd2/links.d
NGINX: /etc/nginx
# package installation config
# state=present style: install missing packages, never upgrade silently —
# the install lane warns with installed-vs-candidate versions instead.
# 'latest' chases the apt candidate; set it per playbook, or per run
# (APT_INSTALL=latest bin/install.sh), RUST_COPY-knob style.
APT_INSTALL: present
APT_BYPASS: False
APT_DEFAULT_COMPONENT: main
APT_DEFAULT_DISTRIBUTION: forky
# current stable release (old sonames live here; see debian-stable.repo.pb)
APT_STABLE_DISTRIBUTION: trixie
APT_DEFAULT_ARCH: True
# Canonical Debian mirror for every consumer (repo playbooks, debootstrap,
# multistrap bootstrap, mkosi, pivot-root). APT_DEBIAN_MIRROR is the bare
# host base for tools that append the repo path themselves (mkosi Mirror=
# joins "/debian"); APT_DEFAULT_MIRROR is the full archive URL.
APT_DEBIAN_MIRROR: http://deb.debian.org
APT_DEFAULT_MIRROR: "{{APT_DEBIAN_MIRROR}}/debian"
APT_ARCH: amd64
UBUNTU_DISTRIBUTION: noble
TMUX_CONF_D_DIR: conf.d
BIND: 0.0.0.0
NODEJS_VERSION: 26
PNPM_VERSION: 12
BUN_VERSION: 1
GO_VERSION: 1
RUST_VERSION: 1
PYTHON_VERSION: 3
YARN_VERSION: 4
BAZEL_VERSION: 8
FLATC_VERSION: 25

DIRSET:
  - opt
  - srv
  - etc
  - var
  - log
  - spool
  - cache
  - src
  - pid
  - share
FONTS_TTF: /usr/share/fonts/truetype
MEDIAS_DIR: /srv/media
SYSTEMD_SYSTEM_UNIT_DIR: /etc/systemd/system
DIRMODE: "0770"
FILEMODE: "0660"
BINMODE: "0775"
GOPATH_DIR: "src/{{go_url|default('')|deprefix('\\w+@')|deprefix('https?://')|regex_replace('^(\\w+):', '\\1/')|trim}}"
HASH: "#"
PERSIST_VARS:
  - NAME
  - INSTANCE
  - DIR
  - PREFIX
  - USER
  - USERMODE
  - OWNER
  - APT_COMPONENT
  - APT_COMPONENTS
  - APT_TRUSTED
  - APT_SOURCELIST
  - APT_TRUST
  - APT_UPDATE_BYPASS
  - BINS
  - GLOBAL_BINS_BYPASS
  - DIR
  - DIRS
  - FILES
  - DIR_BYPASS
  - OPT_BYPASS
  - SRV_BYPASS
  - ETC_BYPASS
  - VAR_BYPASS
  - LOG_BYPASS
  - SPOOL_BYPASS
  - CACHE_BYPASS
  - SRC_BYPASS
  - PID_BYPASS
  - RUN_BYPASS
  - SHARE_BYPASS
  - LINKS
  - LINKS_BYPASS
  - PKGS
  - PKGSET
  - PKGSETS
  - REPO
  - REPO_DIR
  - REPOS
  - HG_REPO
  - SVN_REPO
  - GIT_DIR
  - WITH
  - ENABLE
CA_EXPIRY: "26280h"
HOMEDIR: "/home/{{USER|default(OWNER)|default(_cf_user_id)}}"
GIT_DIR: "{{REPO_DIR|default(DIR, true)}}"
MULTISTRAP_COMPONENTS:
  - main
  - contrib
  - non-free
  - non-free-firmware

_ext: "{{ '.' + item.ext if item.ext|default(False) else '' }}"

# Default bin helpers — the baseline floor merged into every non-nuclear bin.
# Per-bin layers (base_helpers, helpers) union on top; see files/_bin and
# library/filter_plugins/helpers.py.
DEFAULT_HELPERS: ["env", "setopts", "loud"]
CONFIG_DISABLED_SUFFIX: .disabled
# Contexts default to the invoking user across Compfuzor. A playbook may change
# the global default, then override CONFIG_CONTEXT or ZIM_CONTEXT independently.
CONTEXT_DEFAULT: user
CONFIG_CONTEXT: "{{ CONTEXT_DEFAULT }}"
ZIM_CONTEXT: "{{ CONTEXT_DEFAULT }}"
CONFIG_INSTALL_OWNER: config

# Producer delivery defaults to advertised compatible receivers at invocation.
# Explicit KEYBINDING_TARGETS narrows IDs/settings; [] remains no native delivery.
# Native profile selectors and COMPFUZOR_*_PROFILE overrides belong to host descriptions.

# Proc-backed status kind registry. sub_status_proc uses this single ordered map
# to validate check support and compile the selected reporter contributions.
_STATUS_PROC_KINDS:
  mainpid-env:
    reporter: status-mainpid-env.sh
    src: ../status/status-mainpid-env.sh
  exe-current:
    reporter: status-exe-current.sh
    src: ../status/status-exe-current.sh

_binsRun: "{{ BINS_BYPASS|default(False) is falsy and BINS_RUN_BYPASS|default(False) is falsy }}"
_postRun: "{{ 'postRun' if _binsRun else 'skip' }}"

# standard subsystem evaluation contract
# data dependencies (task-local vars):
# - items: array/list of subsystem input rows
# - subsystem_name: subsystem id used for automatic bypass variable resolution
# optional task-local metadata:
# - subsystem_domain: broad domain label (for example: kernel)
# - subsystem_bypass_vars: bypass override; true enables defaults, [true, "X"] extends defaults, ["X"] replaces defaults
# optional overrides:
# - requested, bypassed, valid, errorChecks
errorChecks: []
errors: "{{ errorChecks | selectattr('failed', 'truthy') | map(attribute='msg') | list }}"
_subsystem_requested: "{{ requested | default(items | deflengthy, true) }}"
_subsystem_bypassed: "{{ bypassed | default(lookup('subsys', id=subsystem_name | default(''), domain=subsystem_domain | default(none), bypass=subsystem_bypass_vars | default(none), get='bypassed', default=False), true) | bool }}"
_subsystem_valid: "{{ valid | default(errors | length == 0) | bool }}"
_subsystem_active: "{{ _subsystem_requested and (not _subsystem_bypassed) and _subsystem_valid }}"

SUBSYSTEM:
  get_urls:
    requested: "{{ GET_URLS | deflengthy }}"
    # A dest that is itself a template (e.g. "{{BINS_DIR}}/polytool") passes
    # through raw: defaultDir would mistake the unexpanded string for a
    # relative name and prepend SRC. Lazy var resolution expands it by the
    # time tasks consume the spec (same as templated url rows).
    spec: >-
      {%- set _items = GET_URLS | normalize(to='list') -%}
      {%- set normalized = [] -%}
      {%- for item in _items -%}
        {%- set row = item if item is mapping else {'url': item} -%}
        {%- set url = row.url -%}
        {%- set destRaw = row.dest if row.dest is defined else (url | basename) -%}
        {%- set destName = destRaw if (destRaw is string and destRaw.startswith('{{')) else (destRaw | defaultDir(SRC)) -%}
        {%- set og = {} -%}
        {%- if row.owner is defined and row.owner -%}{%- set _ = og.update({'owner': row.owner}) -%}{%- endif -%}
        {%- if row.group is defined and row.group -%}{%- set _ = og.update({'group': row.group}) -%}{%- endif -%}
        {%- if row.mode is defined and row.mode -%}{%- set _ = og.update({'mode': row.mode}) -%}{%- endif -%}
        {%- set entry = {'url': url, 'dest': destName, 'validate_certs': (row.validate_certs | default(VALIDATE_CERTS | default(true)))} | combine(og) -%}
        {%- set _ = normalized.append(entry) -%}
      {%- endfor -%}
      {{ normalized }}
    contrib:
      ENV:
        GET_URLS_JSON: "{{DIR}}/etc/get-urls.json"
      PKGS: [jq]
      BINS:
        - name: get-urls.sh
          run: true
          generated: |
            # Data contract: DIR/etc/get-urls.json holds the raw get_urls spec
            # rows verbatim (url, dest, mode, ...) -- the same dataset the
            # fs_get_urls tasks consume -- so shell and ansible stay in parity.
            GET_URLS_JSON="${GET_URLS_JSON:-{{DIR}}/etc/get-urls.json}"
            [ -f "$GET_URLS_JSON" ] || { echo "get-urls: missing $GET_URLS_JSON" >&2; exit 1; }
            while IFS=$'\t' read -r url dest mode; do
              [ -n "$url" ] || continue
              echo "Fetching: $url -> $dest"
              zflag=()
              if [ -e "$dest" ]; then zflag=(-z "$dest"); fi
              curl -fsSL "${zflag[@]}" -o "$dest" "$url"
              if [ -n "$mode" ]; then chmod "$mode" "$dest"; fi
            done < <(jq -r '.[] | [.url, .dest, (.mode // "")] | @tsv' "$GET_URLS_JSON")

  go:
    contrib:
      BINS:
        - name: build-go.sh
          bypass: ["BUILD", "GO"]
          run: "{{ BINS_RUN_BYPASS is not deftruthy }}"
          basedir: repo
          generated: |
            {{ GO_COMMENT | join2(prefix='# ') }}
            go build -o ${GO_BIN:-$TYPE} ${GO_TARGET:-./...}
        - name: install-go.sh
          bypass: ["LINK", "GO"]
          basedir: repo
          generated: |
            {{ GO_COMMENT_INSTALL | join2(prefix='# ') }}
            [ -n "${INSTALL_BIN-}" ] || INSTALL_BIN="${GO_BIN:-$TYPE}"
            ln -sfv "$(pwd)/${INSTALL_BIN}" $GLOBAL_BINS_DIR/$(basename $INSTALL_BIN)
      ENV:
        GO_BIN: "{{ GO_BIN | default(omit) }}"
        GO_TARGET: "{{ GO_TARGET | default('./...') }}"
      TOOL_VERSIONS:
        go: true

  nodejs:
    contrib:
      BINS:
        - name: build-nodejs.sh
          bypass: ["BUILD", "NODEJS"]
          run: "{{ BUILD_RUN_BYPASS is not deftruthy and BINS_RUN_BYPASS is not deftruthy }}"
          basedir: repo
          generated: |
            {{ NODEJS_COMMENT | join2(prefix='# ') }}
            if [ -f package-lock.json ] && [ ! -f pnpm-lock.yaml ]; then
              pnpm import
            fi
            pnpm i --frozen-lockfile{{ _nodejs_allow_build_flags }}
            IFS=',' read -ra _cf_build_scripts <<< "${NODEJS_BUILD_SCRIPTS:-build}"
            for _cf_script in "${_cf_build_scripts[@]}"; do
              if jq -e ".scripts.${_cf_script}" package.json > /dev/null 2>&1; then
                echo "Building via ${_cf_script}..."
                pnpm run "${_cf_script}"
              fi
            done
            if [ -n "${NODEJS_BUILD_COMMANDS:-}" ]; then
              IFS=',' read -ra _cf_build_commands <<< "${NODEJS_BUILD_COMMANDS:-}"
              for _cf_cmd in "${_cf_build_commands[@]}"; do
                echo "Running ${_cf_cmd}..."
                ${_cf_cmd}
              done
            fi
        - name: install-nodejs.sh
          bypass: ["LINK", "NODEJS"]
          #run: "{{ INSTALL_RUN_BYPASS is not deftruthy and BINS_RUN_BYPASS is not deftruthy }}"
          basedir: repo
          generated: |
            {{ NODEJS_COMMENT_INSTALL | join2(prefix='# ') }}
            # pnpm >= 10 dropped `pnpm link -g`; `pnpm add -g .` is the live-link
            # replacement (records the package as a `link:` dep of the global
            # project, so bins resolve back into this checkout).
            if [ -n "{{ NODEJS_LINK_DIR | default('') }}" ]; then
              IFS=',' read -ra _cf_link_dirs <<< "{{ NODEJS_LINK_DIR | default('.') }}"
              for _cf_dir in "${_cf_link_dirs[@]}"; do
                (cd "$_cf_dir" && pnpm add -g .)
              done
            else
              pnpm add -g .
            fi
            if [ -n "${NODEJS_PRUNE_SCRIPTS:-}" ]; then
              IFS=',' read -ra _cf_prune_scripts <<< "${NODEJS_PRUNE_SCRIPTS:-}"
              for _cf_script in "${_cf_prune_scripts[@]}"; do
                pnpm run "${_cf_script}"
              done
            elif [ -n "${NODEJS_PRUNE_COMMANDS:-}" ]; then
              IFS=',' read -ra _cf_prune_commands <<< "${NODEJS_PRUNE_COMMANDS:-}"
              for _cf_cmd in "${_cf_prune_commands[@]}"; do
                ${_cf_cmd}
              done
            elif [ "${NODEJS_PRUNE:-}" = "true" ]; then
              pnpm prune --prod
            fi
      ENV: "{{ ({'NODEJS_BIN': NODEJS_BIN}) if NODEJS_BIN is defined else ({}) }}"
      PKGS:
        - build-essential
        - python3
      TOOL_VERSIONS:
        nodejs: true

  bun:
    contrib:
      BINS:
        - name: build-bun.sh
          bypass: ["BUILD", "BUN"]
          run: "{{ BUILD_RUN_BYPASS is not deftruthy and BINS_RUN_BYPASS is not deftruthy }}"
          basedir: repo
          generated: |
            {{ BUN_COMMENT | join2(prefix='# ') }}
            bun install
            if [ -n "${BUN_BUILD_SCRIPTS:-}" ]; then
                IFS=',' read -ra _cf_build_scripts <<< "$BUN_BUILD_SCRIPTS"
                for _cf_script in "${_cf_build_scripts[@]}"; do
                    echo "Building via ${_cf_script}..."
                    bun run "$_cf_script"
                done
            fi
        - name: install-bun.sh
          bypass: ["LINK", "BUN"]
          run: "{{ INSTALL_RUN_BYPASS is not deftruthy and BINS_RUN_BYPASS is not deftruthy }}"
          basedir: repo
          generated: |
            {{ BUN_COMMENT_INSTALL | join2(prefix='# ') }}
            # `bun link` (no -g): bun >= 1.4 misreads `bun link -g` as
            # registering a package literally named "global" and links no
            # bins; bare `bun link` is bun's global-registration form.
            bun link
      ENV: >-
        {{ {} | combine_iff({
          'BUN_BIN': BUN_BIN,
          'BUN_BUILD_SCRIPTS': BUN_BUILD_SCRIPTS | join2(',')
        }) }}
      TOOL_VERSIONS:
        bun: true

  # Unified npm subsystem.
  # Default mode: global install — pnpm install -g for each package in NPM.
  # Source mode (NPM_SRC=true): download tarball, pnpm i / build / link a single package.
  # NPM can be a single package string or a list. Source mode requires a single package.
  # NPM_PACKAGE_BIN overrides the derived binary name in source mode.
  npm:
    spec:
      npm_package_bin: "{{ NPM_PACKAGE_BIN | default((NPM | default('') if NPM is string else (NPM | default([]) | first | default(''))) | regex_replace('(?:@[\\w.-]+/)?([\\w.-]+)(?:@[\\w.-]+)?', '\\1')) }}"
      npm_packages: "{{ NPM if NPM is string else (NPM | default([])) }}"
      npm_src: "{{ NPM_SRC | default(false) | bool }}"
    contrib:
      BINS: "{{ _npm_src_bins if (NPM_SRC | default(false) | bool) else _npm_install_bins }}"
      ETC_FILES: "{{ [] if (NPM_SRC | default(false) | bool) else _npm_install_etc }}"
      ENV:
        NPM_PACKAGE: "{{ NPM if NPM is string else (NPM | default(omit)) }}"
      TOOL_VERSIONS:
        nodejs: true
        pnpm: true

  rust:
    contrib:
      BINS:
        - name: build-rust.sh
          bypass: ["BUILD", "RUST"]
          run: "{{ BINS_RUN_BYPASS is not deftruthy }}"
          basedir: repo
          generated: |
            {{ RUST_COMMENT | join2(prefix='# ') }}
            # Symlink the .tool-version/mise.toml before build, so we get the right version.
            # links.mjs is a provider here (same shape as install-unit.sh):
            # apply the version-manager slice when a link plan exists. A
            # deployment without LINKS artifacts ships no links.mjs; its pin
            # link is build-mise.sh's job, and that runs before this bin in
            # both the build.sh compositor and the bins lane.
            if [ -x "$DIR/bin/links.mjs" ]; then
                "$DIR/bin/links.mjs" apply --scope system --id '*/.tool-versions,*/mise.toml' -q
            fi
            if [[ -n "${RUST_PROFILE:-}" ]]; then
                PROFILE="--profile ${RUST_PROFILE}"
            elif [[ -z "${RELEASE+x}" ]]; then
                PROFILE="--release"
            elif [[ "$RELEASE" == "debug" ]]; then
                PROFILE=""
            else
                PROFILE="--${RELEASE}"
            fi
            [[ -n "${RUST_PKG:-}" ]] && PKG_FLAG="-p ${RUST_PKG}"
            [[ -n "${RUST_FEATURES:-}" ]] && FEATURES_FLAG="--features ${RUST_FEATURES}"
            if [[ -z "${RUST_LOCKED+x}" ]]; then
                [ -f Cargo.lock ] && LOCKED_FLAG="--locked" || LOCKED_FLAG=""
            else
                # Truthy acceptance matches COMPFUZOR_MISE_LINK_FORCE and
                # lowercases first: env.export renders YAML booleans "True".
                case "${RUST_LOCKED,,}" in
                    1|true|yes|on) LOCKED_FLAG="--locked" ;;
                    *) LOCKED_FLAG="" ;;
                esac
            fi
            cargo build ${PROFILE} ${PKG_FLAG:-} ${FEATURES_FLAG:-} ${LOCKED_FLAG:-} ${RUST_CARGO_ARGS:-}
        - name: install-rust.sh
          bypass: ["LINK", "RUST"]
          basedir: repo
          generated: |
            {{ RUST_COMMENT_INSTALL | join2(prefix='# ') }}
            if [[ -n "${RUST_PROFILE:-}" ]]; then
                _target_dir="target/${RUST_PROFILE}"
            elif [[ -z "${RELEASE+x}" ]] || [[ "${RELEASE:-}" != "debug" ]]; then
                _target_dir="target/release"
            else
                _target_dir="target/debug"
            fi
            # RUST_COPY=true installs real files (cp + chmod 0755) instead of
            # symlinks. Needed when the consumer is a non-root daemon: the
            # default symlink resolves through DIR (DIRMODE 0770) and the
            # source checkout (repo symlink, often ~/archive), which a daemon
            # under ProtectHome=yes with its own user cannot traverse.
            # (_copy/_all default-empty first: the setopts helper enables
            # nounset, and bare ${VAR,,} aborts on unexported vars. Truthy
            # acceptance -- 1|true|yes|on, case-insensitive -- matches
            # COMPFUZOR_MISE_LINK_FORCE; env.export renders YAML booleans
            # "True", and 1/yes/on should not silently mean the opposite.)
            _copy="${RUST_COPY:-}"
            _all="${RUST_ALL:-}"
            case "${_copy,,}" in
                1|true|yes|on)
                    _cf_rust_install() {
                        # --remove-destination: a previous symlink install would
                        # otherwise write *through* the link into target/
                        cp -f --remove-destination "$1" "$2"
                        chmod 0755 "$2"
                        printf 'copied %s -> %s\n' "$1" "$2"
                    }
                    ;;
                *)
                    _cf_rust_install() { ln -sfv "$1" "$2"; }
                    ;;
            esac
            case "${_all,,}" in
                1|true|yes|on)
                    for _bin in $(cargo metadata --format-version 1 --no-deps 2>/dev/null | jq -r '[ .packages[] | .targets[] | select(.kind[] | . == "bin") | .name ] | unique[]'); do
                        _cf_rust_install "$(pwd)/${_target_dir}/${_bin}" "${GLOBAL_BINS_DIR}/${_bin}"
                    done
                    ;;
                *)
                    [ -n "${INSTALL_BIN-}" ] || INSTALL_BIN="${RUST_BIN:-{{ TYPE }}}"
                    _cf_rust_install "$(pwd)/${_target_dir}/${INSTALL_BIN}" "${GLOBAL_BINS_DIR}/$(basename "${INSTALL_BIN}")"
                    ;;
            esac
        - name: install-rust-user.sh
          bypass: ["LINK", "RUST"]
          basedir: repo
          generated: |
            if [[ -z "${RUST_LOCKED+x}" ]]; then
                [ -f Cargo.lock ] && LOCKED_FLAG="--locked" || LOCKED_FLAG=""
            else
                case "${RUST_LOCKED,,}" in
                    1|true|yes|on) LOCKED_FLAG="--locked" ;;
                    *) LOCKED_FLAG="" ;;
                esac
            fi
            if grep -q '^\[workspace\]' Cargo.toml 2>/dev/null && ! grep -q '^\[package\]' Cargo.toml 2>/dev/null; then
                if [[ -n "${RUST_PKG:-}" ]]; then
                    _manifest=$(cargo metadata --format-version 1 --no-deps 2>/dev/null | jq -r --arg pkg "${RUST_PKG}" '.packages[] | select(.name == $pkg) | .manifest_path')
                    cargo install ${LOCKED_FLAG:-} --path "$(dirname "$_manifest")"
                else
                    for _manifest in $(cargo metadata --format-version 1 --no-deps 2>/dev/null | jq -r '[ .packages[] | . as $pkg | .targets[] | select(.kind[] | . == "bin") | $pkg.manifest_path ] | unique[]'); do
                        cargo install ${LOCKED_FLAG:-} --path "$(dirname "$_manifest")"
                    done
                fi
            else
                cargo install ${LOCKED_FLAG:-} --path .
            fi
      ENV: >-
        {{ {} | combine_iff({
          'RUST_BIN': RUST_BIN, 'RUST_PKG': RUST_PKG,
          'RUST_FEATURES': RUST_FEATURES, 'RUST_PROFILE': RUST_PROFILE,
          'RUST_CARGO_ARGS': RUST_CARGO_ARGS, 'RUST_ALL': RUST_ALL,
          'RUST_LOCKED': RUST_LOCKED, 'RUST_COPY': RUST_COPY
        }) }}
      PKGS: "{{ RUST_PKGS | default([]) }}"
      TOOL_VERSIONS:
        rust: true

  bazel:
    requested: "{{ BAZEL is deftruthy }}"
    contrib:
      BINS: "{{ _bazel_bins }}"
      TOOL_VERSIONS:
        bazel: true

  cmake:
    requested: "{{ CMAKE is deftruthy or CMAKE_ARGS is defined or CMAKE_BUILDS is defined }}"
    contrib:
      BINS: "{{ _cmake_bins }}"
      PKGS: [cmake, ninja-build]
      ENV: "{{ _cmake_env }}"
      ENV_PRIO: "{{ _cmake_deps_env_prio }}"

  make:
    requested: "{{ MAKE is deftruthy or MAKE_AUTOCONF is deftruthy }}"
    contrib:
      BINS: "{{ _make_bins }}"

  python:
    requested: "{{ PYTHON is deftruthy or PIP is defined }}"
    contrib:
      BINS:
        - name: build-python.sh
          bypass: ["BUILD", "PYTHON"]
          run: "{{ BINS_RUN_BYPASS is not deftruthy }}"
          basedir: repo
          generated: |
            {{ PYTHON_COMMENT | join2(prefix='# ') }}
            {% if PYTHON_BUILD_COMMAND is defined %}
            {{ PYTHON_BUILD_COMMAND }}
            {% else %}
            [ -d .venv ] || uv venv
            {% if PIP is defined %}
            uv pip install -r etc/pip.txt
            {% else %}
            if [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ]; then
              uv pip install -e .
            elif [ -f requirements.txt ]; then
              uv pip install -r requirements.txt
            fi
            {% endif %}
            source {{ DIR }}/bin/venv.source
            {% endif %}
        - name: venv.source
          basedir: repo
          generated: |
            . "$(pwd)/.venv/bin/activate"
      ENV: "{{ {} | combine_iff({'PYTHON_BIN': PYTHON_BIN}, ENV) }}"
      ETC_FILES: "{{ [{'name': 'pip.txt', 'content': (PIP | join('\\n') if PIP is iterable and PIP is not string else PIP | default(''))}] if PIP is defined else [] }}"
      TOOL_VERSIONS:
        python: true

  desktop:
    requested: "{{ DESKTOP is defined }}"
    contrib:
      BINS:
        - name: install-desktop.sh
          generated: |
            {{ DESKTOP_COMMENT | join2(prefix='# ') }}
            {% for entry in (DESKTOP | normalize(to='list')) %}
            {% set df = entry.desktop_file %}
            {% set exec_val = entry.exec | default('') %}
            {% set icon_val = entry.icon | default('') %}
            {% set set_path = entry.path | default(false) | bool %}
            mkdir -p $HOME/.local/share/applications
            desktop-file-install \
              --dir="$HOME/.local/share/applications" \
            {%- if exec_val %}
              --set-key=Exec --set-value="{{ exec_val }}" \
            {%- endif %}
            {%- if icon_val %}
              --set-key=Icon --set-value="$REPO_DIR/{{ icon_val }}" \
            {%- endif %}
            {%- if set_path %}
              --set-key=Path --set-value="$REPO_DIR" \
            {%- endif %}
              "$REPO_DIR/{{ df }}"
            {% endfor %}
      PKGS: [desktop-file-utils]

  patches:
    requested: "{{ PR_PATCHES is defined and PR_PATCHES | length > 0 }}"
    spec: "{{ _pr_patches_spec }}"
    contrib:
      ETC_FILES:
        - name: patches.json
          content: "{{ _pr_patches_spec | to_nice_json }}"
      BINS:
        - name: download-patches.sh
          generated: |
            {{ PATCHES_COMMENT | join2(prefix='# ') }}
            PATCHES_DIR="${DIR}/patches"
            mkdir -p "$PATCHES_DIR"

            _download_one() {
              local index="$1" url="$2" slug="$3" patch_file="$4"
              local dest="$PATCHES_DIR/$patch_file"

              if [ -f "$dest" ]; then
                echo "Already downloaded: $dest"
                return 0
              fi

              echo "Downloading patch $index ($slug)..."
              curl -fsSL "${url}.patch" -o "$dest" || { echo "failed to download patch $index" >&2; return 1; }

              local pr_num
              pr_num=$(echo "$url" | grep -oP '/pull/\K\d+')
              if [ -n "$pr_num" ]; then
                local api_url
                api_url=$(echo "$url" | sed -E 's|^(https://github\.com)/([^/]+)/([^/]+)/pull/([0-9]+).*|\1/api/repos/\2/\3/pulls/\4|')
                if [ -n "$api_url" ]; then
                  curl -fsSL "$api_url" -o "${dest%.patch}.pr.json" 2>/dev/null \
                    || echo "could not fetch PR metadata for $slug (non-terminal)" >&2
                fi
              fi
            }

            if [ ! -f "$PATCHES_JSON" ]; then
              echo "patches.json not found at $PATCHES_JSON" >&2
              exit 1
            fi

            if [ -n "${1:-}" ]; then
              entry=$(jq -c --argjson idx "$1" '.[] | select(.index == $idx)' "$PATCHES_JSON")
              if [ -z "$entry" ]; then
                max=$(jq '.[-1].index' "$PATCHES_JSON")
                echo "Unknown patch index: $1. Valid: 1-$max" >&2
                exit 1
              fi
              _download_one \
                "$(echo "$entry" | jq -r '.index')" \
                "$(echo "$entry" | jq -r '.url')" \
                "$(echo "$entry" | jq -r '.slug')" \
                "$(echo "$entry" | jq -r '.patch_file')"
            else
              while IFS= read -r entry; do
                _download_one \
                  "$(echo "$entry" | jq -r '.index')" \
                  "$(echo "$entry" | jq -r '.url')" \
                  "$(echo "$entry" | jq -r '.slug')" \
                  "$(echo "$entry" | jq -r '.patch_file')"
              done < <(jq -c '.[]' "$PATCHES_JSON")
            fi
        - name: apply-patches.sh
          basedir: repo
          generated: |
            {{ PATCHES_COMMENT_APPLY | join2(prefix='# ') }}
            PATCHES_DIR="${DIR}/patches"

            if [ ! -d "$PATCHES_DIR" ]; then
              echo "No patches directory found. Run download-patches.sh first."
              exit 1
            fi

            shopt -s nullglob
            patches=("$PATCHES_DIR"/*.patch)
            if [ ${#patches[@]} -eq 0 ]; then
              echo "No patches found in $PATCHES_DIR"
              exit 0
            fi

            for patch_file in "${patches[@]}"; do
              echo "Applying $(basename "$patch_file")..."
              git am "$patch_file" || {
                echo "Failed to apply $(basename "$patch_file"). Aborting."
                git am --abort 2>/dev/null
                exit 1
              }
            done
            echo "All ${#patches[@]} patch(es) applied successfully."
      ENV:
        PATCHES_JSON: "{{ DIR }}/etc/patches.json"
      ENV_LIST: [PATCHES_JSON]

  kernel_modprobe:
    requested: "{{ KERNEL_MODULES is defmapping and KERNEL_MODULES | deflengthy }}"
    contrib:
      ETC_FILES:
        - name: kernel.modules.json
          content: "{{ KERNEL_MODULES | to_nice_json }}"
      BINS: "{{ _kernel_modprobe_bins }}"
      ENV:
        KERNEL_MODULES_JSON: "{{ DIR }}/etc/kernel.modules.json"
      ENV_LIST: [KERNEL_MODULES_JSON]
      PKGS: [jq]

  # kernel_sysctl -- manages sysctls declared via KERNEL_SYSCTL (mapping of full
  # dotted path -> value). build-kernel-sysctl.sh emits "<key> = <value>" to
  # /etc/sysctl.d/<NAME>.conf; apply-kernel-sysctl.sh sets them live; status-sysctl.ts
  # reports drift. Common guest: `kernel.panic` (panic->reboot timeout) -- declare
  # it wherever crash-testability matters (pstore/ramoops, kdump) so a panic
  # auto-reboots instead of hanging, and so status flags a regression to 0. Some
  # sysctls (kernel.panic included) also accept a cmdline token (`panic=N`) via
  # KERNEL_PARAMS as a boot-floor; prefer KERNEL_SYSCTL for live tunability +
  # drift reporting, and add the cmdline token only if you want it set before any
  # apply runs.
  kernel_sysctl:
    requested: "{{ KERNEL_SYSCTL is defmapping and KERNEL_SYSCTL | deflengthy }}"
    contrib:
      ETC_FILES:
        - name: kernel.sysctl.json
          content: "{{ KERNEL_SYSCTL | to_nice_json }}"
      BINS: "{{ _kernel_sysctl_bins }}"
      ENV:
        KERNEL_SYSCTL_JSON: "{{ DIR }}/etc/kernel.sysctl.json"
      ENV_LIST: [KERNEL_SYSCTL_JSON]
      PKGS: [jq]

  kernel_sysfs:
    requested: "{{ KERNEL_SYSFS is defmapping and KERNEL_SYSFS | deflengthy }}"
    contrib:
      ETC_FILES:
        - name: kernel.sysfs.json
          content: "{{ KERNEL_SYSFS | to_nice_json }}"
      BINS: "{{ _kernel_sysfs_bins }}"
      ENV:
        KERNEL_SYSFS_JSON: "{{ DIR }}/etc/kernel.sysfs.json"
      ENV_LIST: [KERNEL_SYSFS_JSON]
      PKGS: [jq]

  kernel_params:
    # Raw kernel cmdline tokens that don't fit the <module>.<param>=<value>
    # shape KERNEL_MODULES uses (e.g. memmap=256K$0x100000000, nospectre_v2,
    # rootflags=...). install-kernel-params.sh writes them to /etc/kernel/cmdline
    # idempotently: key=value tokens are replaced by key prefix, flag-style
    # tokens (no =) are added once.
    requested: "{{ KERNEL_PARAMS is sequence and KERNEL_PARAMS | deflengthy }}"
    contrib:
      ETC_FILES:
        - name: kernel.params.json
          content: "{{ KERNEL_PARAMS | default([]) | to_nice_json }}"
      BINS: "{{ _kernel_params_bins }}"
      ENV:
        KERNEL_PARAMS_JSON: "{{ DIR }}/etc/kernel.params.json"
      ENV_LIST: [KERNEL_PARAMS_JSON]
      PKGS: [jq]

  kernel_bls:
    # Regenerate systemd-boot BLS entries after the cmdline-writing kernel
    # subsys (kernel_modprobe / kernel_params) update /etc/kernel/cmdline.
    # Active exactly when either of those is, since either writes the cmdline
    # that kernel-install propagates to the ESP. install-kernel-bls.sh runs last
    # (see _kernel_bls_bins + gen_kernel merge order) and is gated at runtime by
    # KERNEL_INSTALL (default off -> warn) so the cmdline->BLS gap is visible.
    requested: "{{ (KERNEL_MODULES is defmapping and KERNEL_MODULES | deflengthy) or (KERNEL_PARAMS is sequence and KERNEL_PARAMS | deflengthy) }}"
    contrib:
      BINS: "{{ _kernel_bls_bins }}"

  readme:
    requested: "{{ README is defined }}"
    contrib:
      ETC_FILES:
        - name: README.md
          dest: "{{DIR}}/README.md"
          content: "{{ README }}"

  status:
    # requested when dir dumps are declared, or any subsystem contributed a
    # reporter to STATUSES (gen_kernel and gen_status_proc append their
    # contributions before the status parent is resolved).
    requested: "{{ (STATUS_DIRS is deftruthy) or (STATUS_DIRS_SUDO is deftruthy) or ((STATUSES | default([])) | length > 0) }}"
    contrib:
      BINS: "{{ [ {'name': 'status.sh', 'src': '../status/status.sh', 'basedir': false, 'deployment_rooted': true} ] + ([ {'name': 'status-dirs.sh', 'src': '../status/status-dirs.sh', 'basedir': false} ] if (STATUS_DIRS is deftruthy or STATUS_DIRS_SUDO is deftruthy) else []) }}"
      ENV:
        STATUS_DIRS: "{{ STATUS_DIRS | join2(':') }}"
        STATUS_DIRS_SUDO: "{{ STATUS_DIRS_SUDO | join2(':') }}"

  # Vars-phase subsystem (NOT a gen_* one): a service declares SYSTEMD_ENV
  # (mapping of VAR -> value) to publish those vars to the systemd manager on
  # start and clear them on stop. vars_systemd_env.tasks injects
  # ExecStartPost/ExecStop into SYSTEMD_SERVICES, so it MUST run before
  # vars_systemd_unit.tasks freezes the unit ETC_FILES -- which the gen_* phase
  # comes too late for. Registered here purely for active/bypass/status parity
  # (lookup('subsys', id='systemd_env')); bypass via SYSTEMD_ENV_BYPASS.
  systemd_env:
    requested: "{{ SYSTEMD_ENV is mapping and (SYSTEMD_ENV | length > 0) }}"

  # sysusers -- declarative daemon identity via sysusers.d(5) fragments.
  # Design: .design/gen-user/init.md (beads: compfuzor-gen-user). `u`/`g`
  # lines declare a name (exactly one declarer per name -- duplicates warn
  # per sysusers.d(5), earliest filename wins); `m` lines consume a name
  # (implicit creation makes consumers standalone-safe, so run order never
  # matters). SYSTEMD_SYSUSER: True derives a `u` line from
  # SYSTEMD_SERVICES.User= in gen_sysusers.tasks -- a generator switch, not a
  # declaration (absent = the name belongs to a package or someone else).
  # Inert under USERMODE: user-scope units never need system accounts.
  # Bypass: SYSUSERS_BYPASS skips the whole subsystem.
  sysusers:
    requested: "{{ SYSUSERS is deftruthy or SYSTEMD_SYSUSER is deftruthy }}"
    contrib:
      LINKS:
        # links.mjs owns the /etc/sysusers.d symlink (policy replace, matching
        # the old ln -sfn): status reports drift, audit cross-checks, remove
        # uninstalls. install-sysusers.sh applies this record before running
        # systemd-sysusers.
        - src: "{{ETC}}/sysusers.d/{{NAME}}.conf"
          dest: "{{SYSUSERSDIR}}/{{NAME}}.conf"
          scope: system
          policy: replace
      ETC_DIRS:
        - sysusers.d
      ETC_FILES:
        - name: sysusers.d/{{NAME}}.conf
          mode: "0644"
          content: "{{ _sysusers_specs | sysusers_render }}"
      STATUSES:
        - status-sysusers.sh
      BINS:
        # Not auto-run (matches install-service.sh / other install bins):
        # bins_run skips it; `sudo bash bin/install.sh` invokes it via the
        # identity lane, keeping privileged steps out of the ansible pass.
        # Creation is idempotent, so compositor re-runs are cheap.
        - name: install-sysusers.sh
          bypass: ["LINK", "SYSUSERS"]
          phase: identity
          generated: |
            SYSUSERSDIR="{{SYSUSERSDIR}}"
            SUDO_CMD="sudo"
            _src="${DIR}/etc/sysusers.d/{{NAME}}.conf"
            _dest="${SYSUSERSDIR}/{{NAME}}.conf"
            if [ ! -f "$_src" ]; then
                echo "sysusers: missing staged fragment: ${_src}" >&2
                exit 1
            fi
            if [ "${1:-}" = "--copy" ] || [ -n "${SYSUSERS_COPY:-}" ]; then
                $SUDO_CMD cp --remove-destination -f "$_src" "$_dest"
            elif [ -x "${DIR}/bin/links.mjs" ]; then
                # Link creation delegated to links.mjs (the LINKS subsystem
                # owns every managed symlink; this fragment's record is in
                # DIR/links.json). Auto privilege routing escalates the
                # unwritable /etc/sysusers.d dest through sudo on its own.
                "${DIR}/bin/links.mjs" apply --id "system:$_dest"
            else
                $SUDO_CMD ln -sfn "$_src" "$_dest"
            fi
            # Path argument with a slash: this fragment only, not the whole
            # directory search. Idempotent; skips names that already exist.
            $SUDO_CMD systemd-sysusers "$_dest"
        # Drift reporter for declared identity: a vanished user/group is
        # invisible to links (it manages symlinks, not passwd entries), so
        # status.sh carries this instead. Exit per status.sh convention:
        # 0 clean, 1 drift, 2 not-applicable.
        - name: status-sysusers.sh
          basedir: False
          compose: False
          bypass: ["SYSUSERS"]
          content: |
            _frag="${DIR}/etc/sysusers.d/{{NAME}}.conf"
            if [ ! -f "$_frag" ]; then
                exit 2
            fi
            _drift=0
            while read -r kind name rest; do
                case "${kind}" in
                    u|U)
                        if ! getent passwd "${name}" >/dev/null; then
                            echo "missing user: ${name}"
                            _drift=1
                        fi
                        ;;
                    g|G)
                        if ! getent group "${name}" >/dev/null; then
                            echo "missing group: ${name}"
                            _drift=1
                        fi
                        ;;
                    m|M)
                        _grp="${rest%% *}"
                        if ! getent group "${_grp}" 2>/dev/null | grep -qw "${name}"; then
                            echo "missing membership: ${name} in ${_grp}"
                            _drift=1
                        fi
                        ;;
                esac
            done < <(grep -E '^[ugmUgM] ' "$_frag")
            if [ "${_drift}" = 0 ]; then
                echo "sysusers: all declared identities present"
            fi
            exit "${_drift}"

  # aptlane -- install-time package convergence + drift reporting for the
  # declared package list (PKGS/PKGSET/PKGSETS, gathered in gen_apt.tasks
  # mirroring pkgs.tasks). install-apt.sh joins install.sh's run_all in the
  # `packages` lane (ahead of identity), so a fresh box converges with one
  # `sudo bash bin/install.sh` even when the render pass skipped installs
  # (PKGS_BYPASS/APT_BYPASS). Deliberately NOT gated on those flags: the id
  # is `aptlane`, not `apt`, so the subsys <ID>_BYPASS convention does NOT
  # auto-bind APT_BYPASS (a render-side bypass that must not kill the
  # lane); APTLANE_BYPASS is the explicit generation opt-out.
  # Deliberately NO apt-get update in the lane: repo configuration and
  # index refresh stay render-side (apt.tasks -> ../apt.update.tasks).
  # APT_INSTALL disposition (default 'present', matching the render-side
  # default): install missing packages only (--no-upgrade), then report
  # installed-vs-candidate drift with both versions rather than upgrading
  # silently; 'latest' upgrades to the apt candidate. The playbook default
  # is baked into the lane and runtime-overridable
  # (APT_INSTALL=latest bin/install.sh) — the same expectation-altering
  # knob pattern as RUST_COPY. APTLANE_BYPASS remains the hard opt-out.
  # status-apt.sh reports drift per the PKG_STATUS map (pkg -> installed |
  # latest | ignore; unlisted = installed) per the status.sh convention.
  aptlane:
    requested: "{{ (PKGS|default([])|length > 0) or (PKGSET|default([])|length > 0) or (PKGSETS|default([])|length > 0) }}"
    contrib:
      STATUSES:
        - status-apt.sh
      ENV: >-
        {{ {} | combine_iff({'APT_INSTALL': APT_INSTALL|default('present')}) }}
      BINS:
        - name: install-apt.sh
          phase: packages
          generated: |
            command -v apt-get >/dev/null 2>&1 || { echo "apt: apt-get not found, skipping"; exit 0; }
            SUDO_CMD="sudo"
            _pkgs="{{ _apt_pkgs | join(' ') }}"
            [ -n "$_pkgs" ] || { echo "apt: no packages declared"; exit 0; }
            # No apt-get update here on purpose (see apt subsystem notes).
            # APT_INSTALL disposition (RUST_COPY-style knob): the playbook
            # default is baked in below; an exported or shell-local
            # APT_INSTALL overrides it for this run (envdefault never
            # stomps a caller value). 'present' installs missing packages
            # only (--no-upgrade) then reports installed-vs-candidate
            # drift; 'latest' upgrades to the candidate. Parity with
            # render-time pkgs.tasks state.
            _install="${APT_INSTALL:-{{ APT_INSTALL|default('present') }}}"
            case "${_install}" in
                present|latest) ;;
                *) echo "apt: unknown APT_INSTALL '${_install}' (expected present|latest)" >&2; exit 1 ;;
            esac
            if [ "${_install}" = "latest" ]; then
                _upgrade="--upgrade"
            else
                _upgrade="--no-upgrade"
            fi
            $SUDO_CMD env DEBIAN_FRONTEND=noninteractive apt-get install -y ${_upgrade} ${_pkgs}
            if [ "${_install}" = "present" ]; then
                # state=present never upgrades silently: warn with both
                # versions instead. Exit stays 0; status-apt.sh owns the
                # drift exit semantics.
                _stale=0
                for _p in ${_pkgs}; do
                    _v="$(dpkg-query -W -f='${Version}' "${_p}" 2>/dev/null || true)"
                    [ -n "${_v}" ] || continue
                    _c="$(apt-cache policy "${_p}" 2>/dev/null | awk '/Candidate:/ {print $2; exit}' || true)"
                    # `|| true`: awk's early `exit` SIGPIPEs apt-cache under
                    # pipefail, and set -e would kill the lane on it.
                    if [ -n "${_c}" ] && [ "${_c}" != "(none)" ] && [ "${_c}" != "${_v}" ]; then
                        echo "apt: stale (present): ${_p} installed ${_v} < candidate ${_c}" >&2
                        _stale=$((_stale + 1))
                    fi
                done
                if [ "${_stale}" -gt 0 ]; then
                    echo "apt: ${_stale} declared package(s) behind candidates; APT_INSTALL=latest upgrades them" >&2
                else
                    echo "apt: all declared packages present, no newer candidates"
                fi
            fi
        - name: status-apt.sh
          basedir: False
          compose: False
          content: |
            command -v dpkg-query >/dev/null 2>&1 || exit 2
            command -v apt-cache >/dev/null 2>&1 || exit 2
            _pkgs="{{ _apt_pkgs | join(' ') }}"
            [ -n "$_pkgs" ] || exit 2
            declare -A _req=(
            {% for _p, _r in (PKG_STATUS|default({})).items() %}              [{{ _p }}]={{ _r }}
            {% endfor %}          )
            _drift=0
            for _p in ${_pkgs}; do
                _level="${_req[${_p}]:-installed}"
                [ "${_level}" = ignore ] && continue
                _ver="$(dpkg-query -W -f='${Version}' "${_p}" 2>/dev/null || true)"
                if [ -z "${_ver}" ]; then
                    echo "missing package: ${_p}"
                    _drift=1
                    continue
                fi
                [ "${_level}" = latest ] || continue
                # 'latest' compares against the CURRENT apt index (no
                # update here): status is advisory against what apt knows.
                _cand="$(apt-cache policy "${_p}" 2>/dev/null | awk '/Candidate:/ {print $2; exit}' || true)"
                if [ -n "${_cand}" ] && [ "${_cand}" != "(none)" ] && [ "${_cand}" != "${_ver}" ]; then
                    echo "stale package: ${_p} (${_ver} != candidate ${_cand})"
                    _drift=1
                fi
            done
            if [ "${_drift}" = 0 ]; then
                echo "apt: all declared packages satisfy their requirements"
            fi
            exit "${_drift}"

  # archlane -- install-time package convergence + drift reporting for the
  # declared Arch-family package list (ARCH_PKGS/ARCH_PKGSET/ARCH_PKGSETS,
  # gathered once in gen_arch.tasks; pkgs.tasks consumes the same
  # _arch_pkgs fact for its render-side pacman apply). install-arch.sh
  # joins install.sh's run_all in the `packages` lane alongside
  # install-apt.sh; each lane self-gates on the package manager binary, so
  # dual-list playbooks (PKGS for Debian + ARCH_PKGS for Arch) converge
  # correctly on either family. Deliberately NOT gated on PKGS_BYPASS/
  # APT_BYPASS (render-side bypasses that must not kill the lane);
  # ARCHLANE_BYPASS is the explicit generation opt-out.
  # Deliberately NO `pacman -Sy` in the lane: index refresh stays
  # render-side, and immutable images (SteamOS) ship their sync db in the
  # image. `pacman -S --needed` is the convergence semantics: install
  # missing, upgrade stale, skip satisfied (APT_INSTALL 'latest' parity;
  # arch has no cheap 'present' pin without version specs).
  # status-arch.sh reports drift per the PKG_STATUS map like status-apt.sh.
  archlane:
    requested: "{{ (ARCH_PKGS|default([])|length > 0) or (ARCH_PKGSET|default([])|length > 0) or (ARCH_PKGSETS|default([])|length > 0) }}"
    contrib:
      STATUSES:
        - status-arch.sh
      BINS:
        - name: install-arch.sh
          phase: packages
          generated: |
            command -v pacman >/dev/null 2>&1 || { echo "arch: pacman not found, skipping"; exit 0; }
            command -v pacman-conf >/dev/null 2>&1 || { echo "arch: pacman-conf not found, skipping"; exit 0; }
            [ -n "$(pacman-conf --repo-list 2>/dev/null)" ] || { echo "arch: no pacman repositories configured, skipping"; exit 0; }
            SUDO_CMD="sudo"
            _pkgs="{{ _arch_pkgs | join(' ') }}"
            [ -n "$_pkgs" ] || { echo "arch: no packages declared"; exit 0; }
            # No pacman -Sy here on purpose (see archlane notes): --needed
            # converges against whatever index the host already has.
            $SUDO_CMD pacman -S --needed --noconfirm ${_pkgs}
        - name: status-arch.sh
          basedir: False
          compose: False
          content: |
            command -v pacman >/dev/null 2>&1 || exit 2
            command -v pacman-conf >/dev/null 2>&1 || exit 2
            [ -n "$(pacman-conf --repo-list 2>/dev/null)" ] || exit 2
            _pkgs="{{ _arch_pkgs | join(' ') }}"
            [ -n "$_pkgs" ] || exit 2
            declare -A _req=(
            {% for _p, _r in (PKG_STATUS|default({})).items() %}              [{{ _p }}]={{ _r }}
            {% endfor %}          )
            _drift=0
            for _p in ${_pkgs}; do
                _level="${_req[${_p}]:-installed}"
                [ "${_level}" = ignore ] && continue
                _ver="$(pacman -Q "${_p}" 2>/dev/null | awk '{print $2; exit}')"
                if [ -z "${_ver}" ]; then
                    echo "missing package: ${_p}"
                    _drift=1
                    continue
                fi
                [ "${_level}" = latest ] || continue
                # 'latest' compares against the CURRENT sync db (no refresh
                # here): status is advisory against what pacman knows.
                _cand="$(pacman -Si "${_p}" 2>/dev/null | awk '/^Version:/ {print $3; exit}')"
                if [ -n "${_cand}" ] && [ "${_cand}" != "${_ver}" ]; then
                    echo "stale package: ${_p} (${_ver} != candidate ${_cand})"
                    _drift=1
                fi
            done
            if [ "${_drift}" = 0 ]; then
                echo "arch: all declared packages satisfy their requirements"
            fi
            exit "${_drift}"

_pr_patches_raw: "{{ PR_PATCHES | normalize(to='list') }}"
_pr_patches_spec: >-
  {%- set normalized = [] -%}
  {%- for entry in _pr_patches_raw -%}
    {%- set row = entry if entry is mapping else {'url': entry} -%}
    {%- set url = row.url -%}
    {%- set pr_num = url | regex_replace('.*/pull/(\\d+)$', '\\1') -%}
    {%- set slug = row.name | default(pr_num) -%}
    {%- set _ = normalized.append({'index': loop.index, 'url': url, 'slug': slug, 'pr_num': pr_num}) -%}
  {%- endfor -%}
  {{ normalized }}

_nodejs_build_scripts: "{{ (NODEJS_BUILD_SCRIPTS | default(NODEJS_BUILD_SCRIPT)) | normalize(to='list') }}"
_nodejs_build_commands: "{{ (NODEJS_BUILD_COMMANDS | default(NODEJS_BUILD_COMMAND)) | normalize(to='list') }}"
_nodejs_prune_scripts: "{{ (NODEJS_PRUNE_SCRIPTS | default(NODEJS_PRUNE_SCRIPT)) | normalize(to='list') }}"
_nodejs_prune_commands: "{{ (NODEJS_PRUNE_COMMANDS | default(NODEJS_PRUNE_COMMAND)) | normalize(to='list') }}"
# pnpm 12 fails installs whose dependency build scripts were gated; approve
# named deps with --allow-build flags on the nodejs build's `pnpm i` line.
_nodejs_allow_builds: "{{ (NODEJS_ALLOW_BUILDS | default(NODEJS_ALLOW_BUILD)) | normalize(to='list') }}"
_nodejs_allow_build_flags: "{{ (' --allow-build=' ~ (_nodejs_allow_builds | join(' --allow-build='))) if _nodejs_allow_builds | length > 0 else '' }}"

_npm_src_bins:
  - name: build-npm.sh
    generated: |
      {{ NPM_COMMENT | join2(prefix='# ') }}
      curl $(npm view $NPM_PACKAGE dist.tarball) | tar -xz --strip-components=1
      pnpm i
      IFS=',' read -ra _cf_build_scripts <<< "${NODEJS_BUILD_SCRIPTS:-build}"
      for _cf_script in "${_cf_build_scripts[@]}"; do
        if jq -e ".scripts.${_cf_script}" package.json > /dev/null 2>&1; then
          echo "Building via ${_cf_script}..."
          pnpm run "${_cf_script}"
        fi
      done
      if [ -n "${NODEJS_BUILD_COMMANDS:-}" ]; then
        IFS=',' read -ra _cf_build_commands <<< "${NODEJS_BUILD_COMMANDS:-}"
        for _cf_cmd in "${_cf_build_commands[@]}"; do
          echo "Running ${_cf_cmd}..."
          ${_cf_cmd}
        done
      fi
      pnpm link

_npm_install_bins:
  - name: install-npm.sh
    run: "{{ INSTALL_RUN_BYPASS is not deftruthy and BINS_RUN_BYPASS is not deftruthy }}"
    generated: |
      {{ NPM_COMMENT_INSTALL | join2(prefix='# ') }}
      pnpm install -g{% set _ab = NPM_ALLOW_BUILD | default(False) %}{% if _ab %}{% for _pkg in ((NPM | normalize(to='list')) if (_ab | type_debug == 'bool') else (_ab | normalize(to='list'))) %} --allow-build={{ _pkg }}{% endfor %}{% endif %} $(cat etc/npm.txt) $*

