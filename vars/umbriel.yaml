---
# Shared Umbriel source-build contract. Consumers choose the installation
# prefix and source type; the regular and SteamOS playbooks use the same build
# and package declarations so they cannot silently drift.

# Debian-family build dependencies. xwayland-satellite and
# xdg-desktop-portal-umbriel are not packaged in Debian as of 2026-09; the
# former already has its own compfuzor source playbook and the latter remains a
# separate optional integration.
UMBRIEL_PKGS:
  - build-essential
  - git
  - meson
  - ninja-build
  - pkg-config
  - wayland-protocols
  - libwayland-dev
  - libwlroots-0.20-dev
  - libxkbcommon-dev
  - libinput-dev
  - libpixman-1-dev
  - libdrm-dev
  - libegl-dev
  - libgles2-mesa-dev
  - libgbm-dev
  - liblcms2-dev
  - libcairo2-dev
  - libpango1.0-dev
  - libtomlplusplus-dev
  - nlohmann-json3-dev
  - libudev-dev
  - libjemalloc-dev
  - kitty

# Arch/SteamOS build dependencies. Arch packages include development headers;
# gcc rather than base-devel keeps SteamOS root usage tighter.
UMBRIEL_ARCH_PKGS:
  - gcc
  - git
  - meson
  - ninja
  - pkgconf
  - wayland
  - wayland-protocols
  - wlroots0.20
  - libxkbcommon
  - libinput
  - pixman
  - libdrm
  - mesa
  - cairo
  - pango
  - tomlplusplus
  - nlohmann-json
  - lcms2
  - systemd-libs
  - jemalloc
  - xwayland-satellite
  - kitty

UMBRIEL_ACTIONS:
  - name: build.sh
    basedir: repo
    content: |
      # Keep mutable Meson/Ninja state in the local deployment, never in the
      # archive checkout: ~/archive may be CIFS, where timestamp/mode behavior
      # causes false Git dirtiness and corrupted/incessantly rebuilt Ninja state.
      _build="${DIR}/build-release"
      _prefix={{ UMBRIEL_PREFIX | quote }}
      # Refresh Git's stat cache before Meson's vcs_tag. This is read-only with
      # respect to worktree content and prevents clean jj-colocated checkouts
      # on bind-mounted storage from acquiring a spurious `-dirty` version.
      git status --porcelain >/dev/null
      {% if UMBRIEL_CLEAN_BUILD|default(false)|bool %}
      rm -rf "$_build"
      {% endif %}
      if [ -f "$_build/meson-private/coredata.dat" ]; then
          meson setup "$_build" --reconfigure \
              --buildtype=release --prefix="$_prefix" -Dtests=disabled
      else
          meson setup "$_build" \
              --buildtype=release --prefix="$_prefix" -Dtests=disabled
      fi
      meson compile -C "$_build"
  # Package lanes run first; this main-lane leaf then builds as the invoking
  # user and escalates only Meson's install operation.
  - name: install-umbriel.sh
    phase: main
    basedir: repo
    content: |
      if [ "$(id -u)" -eq 0 ] && [ -n "${SUDO_USER:-}" ] && [ "${SUDO_USER}" != root ]; then
          echo "install-umbriel: run bin/install.sh as ${SUDO_USER}, not through sudo" >&2
          echo "the package and install leaves invoke sudo only where needed" >&2
          exit 1
      fi
      "${DIR}/bin/build.sh"
      sudo meson install -C "${DIR}/build-release"
      _prefix={{ UMBRIEL_PREFIX | quote }}
      # Meson can preserve executable bits from unusual source filesystems;
      # systemd warns on executable unit files, and none of these data files
      # should be executable.
      sudo chmod 0644 \
          "$_prefix/lib/systemd/user/umbriel.service" \
          "$_prefix/lib/systemd/user/umbriel-session.target" \
          "$_prefix/lib/systemd/user/umbriel-shutdown.target" \
          "$_prefix/share/wayland-sessions/umbriel.desktop" \
          "$_prefix/share/umbriel/config.toml" \
          "$_prefix/share/umbriel/shaders/reveal.glsl" \
          "$_prefix/share/umbriel/shaders/squash.glsl"
      systemctl --user daemon-reload
  - name: validate.sh
    compose: false
    content: |
      {{ UMBRIEL_PREFIX | quote }}/bin/umbriel validate "$@"
  - name: run-nested.sh
    compose: false
    content: |
      exec {{ UMBRIEL_PREFIX | quote }}/bin/start-umbriel "$@"
