---
# Keep recipe type semantics while relocating image-owned deployment types onto
# SteamOS's persistent /opt mount. opt and srv already use persistent native
# SteamOS mounts; user deployments already live under persistent /home.
TYPE_DIRS:
  src: "{{HOMEDIR}}/src"
  etc: /opt/etc
  repo: /opt/repo
  pkg: /opt/pkg
  deb: /opt/pkg

# Keep authored config with the durable deployment and expose it at the normal
# /etc/opt location when privileged link creation is available.
ETC: "{{ DIR if type == 'etc' else DIR + '/etc' }}"
ETC_LINK: "{{ ETCS_DIR + '/' + NAME if DIR != ETCS_DIR + '/' + NAME else DIR }}"

# Keep source checkouts and downloaded source artifacts inside the durable
# deployment. Their conventional /usr/local/src exposure is replayable and may
# be bypassed until the persistent /usr/local mount is restored.
SRC: "{{ DIR if type == 'src' else DIR + '/src' }}"
SRC_LINK: "{{ SRCS_DIR + '/' + NAME if SRC != SRCS_DIR + '/' + NAME else SRC }}"
