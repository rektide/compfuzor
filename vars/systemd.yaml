SYSTEMD_OPTS: ""
SYSTEMD_OPTS_AND_SCOPE: "--{{SYSTEMD_SCOPE}} {{SYSTEMD_OPTS}}"
SYSTEMD_SCOPE: system
SYSTEMD_SYSLOG_IDENTIFIER: "{{NAME}}"
SYSTEMD_UNIT_DIR: "{{ lookup('vars', 'SYSTEMD_'+SYSTEMD_SCOPE|upper+'_UNIT_DIR') }}"
SYSTEMD_CONF_DIR: "{{ lookup('vars', 'SYSTEMD_'+SYSTEMD_SCOPE|upper+'_CONF_DIR') }}"

# Per-scope, per-unit-type generation gates
# These control whether to generate unit files for each scope+type combination
SYSTEMD_DUAL: true # Generate both system and user scope units
SYSTEMD_SYSTEM_SERVICE: true
SYSTEMD_SYSTEM_SOCKET: true
SYSTEMD_SYSTEM_DNSSD: true
SYSTEMD_SYSTEM_MOUNT: true

SYSTEMD_USER_SERVICE: true
SYSTEMD_USER_SOCKET: true
SYSTEMD_USER_DNSSD: true
SYSTEMD_USER_MOUNT: true

# Install script generation: system | user | both | separate | none | true | false
# true=both, false=none. Default based on USERMODE.
# separate=generate two unit files (system + user with USERMODE=true) and both install scripts
SYSTEMD_INSTALL: system
# Whether generated install scripts enable their unit (enable --now). Set false
# per-root (or top-level) for units that should only be linked, e.g. a
# socket-activated service (enable the .socket, link-only the .service).
SYSTEMD_ENABLE: true
# Whether the install script also starts the unit now (enable --now vs enable).
# Set false to enable for boot without starting immediately.
SYSTEMD_START: true
SYSTEMD_SYSTEM_SERVICE_INSTALL: "{{ SYSTEMD_INSTALL in ['system', 'both', 'separate', true] }}"
SYSTEMD_USER_SERVICE_INSTALL: "{{ SYSTEMD_INSTALL in ['user', 'both', 'separate', true] }}"
SYSTEMD_SYSTEM_SOCKET_INSTALL: "{{ SYSTEMD_INSTALL in ['system', 'both', 'separate', true] }}"
SYSTEMD_USER_SOCKET_INSTALL: "{{ SYSTEMD_INSTALL in ['user', 'both', 'separate', true] }}"
SYSTEMD_SYSTEM_MOUNT_INSTALL: "{{ SYSTEMD_INSTALL in ['system', 'both', 'separate', true] }}"
SYSTEMD_USER_MOUNT_INSTALL: "{{ SYSTEMD_INSTALL in ['user', 'both', 'separate', true] }}"
SYSTEMD_SYSTEM_DNSSD_INSTALL: "{{ SYSTEMD_INSTALL in ['system', 'both', 'separate', true] }}"
SYSTEMD_USER_DNSSD_INSTALL: "{{ SYSTEMD_INSTALL in ['user', 'both', 'separate', true] }}"

# Computed gate for current scope+unit_type (used in systemd.unit.includes)
SYSTEMD_UNIT_GATE: "{{ lookup('vars', 'SYSTEMD_'+SYSTEMD_SCOPE|upper+'_'+unit_type|upper, default=True) }}"

# Service suffix for user services (.user.service)
SYSTEMD_SERVICE_SUFFIX: "{{ '.user' if SYSTEMD_SCOPE == 'user' else '' }}"

SYSTEMD_BINFMT: "{{_systemd_vars.stdout_lines[0]}}"
SYSTEMD_CATALOG_DIR: "{{_systemd_vars.stdout_lines[1]}}"
SYSTEMD_MODULES_LOAD_DIR: "{{_systemd_vars.stdout_lines[2]}}"
SYSTEMD_PC_FILE_DIR: "{{_systemd_vars.stdout_lines[3]}}"
SYSTEMD_PREFIX: "{{_systemd_vars.stdout_lines[4]}}"
SYSTEMD_SYSCTL_DIR: "{{_systemd_vars.stdout_lines[5]}}"
SYSTEMD_SHUTDOWN_DIR: "{{_systemd_vars.stdout_lines[6]}}"
SYSTEMD_SLEEP_DIR: "{{_systemd_vars.stdout_lines[7]}}"
SYSTEMD_SYSTEM_CONF_DIR: "{{_systemd_vars.stdout_lines[8]}}"
SYSTEMD_GENERATOR_DIR: "{{_systemd_vars.stdout_lines[9]}}"
SYSTEMD_PRESET_DIR: "{{_systemd_vars.stdout_lines[10]}}"
SYSTEMD_SYSTEM_UNIT_DIR: "{{_systemd_vars.stdout_lines[11]}}"
SYSTEMD_NETWORK_DIR: "{{_systemd_vars.stdout_lines[11]|regex_replace('system', 'network')}}"
SYSTEMD_UNIT_PATH: "{{_systemd_vars.stdout_lines[12]}}"
SYSTEMD_USER_CONF_DIR: "{{_systemd_vars.stdout_lines[13]}}"
SYSTEMD_USER_GENERATOR_DIR: "{{_systemd_vars.stdout_lines[14]}}"
SYSTEMD_USER_PRESET_DIR: "{{_systemd_vars.stdout_lines[15]}}"
SYSTEMD_USER_UNIT_DIR: "{{_systemd_vars.stdout_lines[16]}}"
SYSTEMD_USER_UNIT_PATH: "{{_systemd_vars.stdout_lines[17]}}"
SYSTEMD_UTIL_DIR: "{{_systemd_vars.stdout_lines[18]}}"
SYSTEMD_GID_MAX: "{{_systemd_vars.stdout_lines[19]}}"
SYSTEMD_UID_MAX: "{{_systemd_vars.stdout_lines[20]}}"
SYSTEMD_USERS_DIR: "{{_systemd_vars.stdout_lines[21]}}"
SYSTEMD_TMPFILES_DIR: "{{_systemd_vars.stdout_lines[22]}}"
# Type configuration for systemd unit generation
# sections: list of section names (including [Unit] and [Install] where applicable)
# var_suffix: variable suffix for type-specific data (e.g., SYSTEMD_SERVICES)
# dir_map: target directory mapping (system, network, nspawn)
SYSTEMD_TYPE_CONFIG:
  service:
    sections: [Unit, Service, Install]
    var_suffix: SERVICES
    dir_map: system
  socket:
    sections: [Unit, Socket, Install]
    var_suffix: SOCKETS
    dir_map: system
  mount:
    sections: [Unit, Mount, Install]
    var_suffix: MOUNTS
    dir_map: system
  timer:
    sections: [Unit, Timer, Install]
    var_suffix: TIMERS
    dir_map: system
  path:
    sections: [Unit, Path, Install]
    var_suffix: PATHS
    dir_map: system
  slice:
    sections: [Unit, Slice]
    var_suffix: SLICES
    dir_map: system
  scope:
    sections: [Unit, Scope]
    var_suffix: SCOPES
    dir_map: system
  target:
    sections: [Unit, Install]
    var_suffix: TARGETS
    dir_map: system
  automount:
    sections: [Unit, Automount, Install]
    var_suffix: AUTOMOUNTS
    dir_map: system
  swap:
    sections: [Unit, Swap, Install]
    var_suffix: SWAPS
    dir_map: system
  dnssd:
    sections: [Service, Install]
    var_suffix: DNSSDS
    dir_map: system
  network:
    sections:
      - Match
      - Network
      - Address
      - Neighbor
      - IPv6AddressLabel
      - Link
      - RoutingPolicyRule
      - NextHop
      - QDisc
      - NetworkEmulator
      - TokenBucketFilter
      - PFIFO
      - BFIFO
      - PFIFOFast
      - PFIFOHeadDrop
      - CAKE
      - ControlledDelay
      - DeficitRoundRobinScheduler
      - DeficitRoundRobinSchedulerClass
      - EnhancedTransmissionSelection
      - FairQueueing
      - FairQueueingControlledDelay
      - FlowQueuePIE
      - GenericRandomEarlyDetection
      - HeavyHitterFilter
      - HierarchyTokenBucket
      - HierarchyTokenBucketClass
      - QuickFairQueueing
      - QuickFairQueueingClass
      - BandMultiQueueing
      - ClassfulMultiQueueing
      - StochasticFairBlue
      - StochasticFairnessQueueing
      - TrivialLinkEqualizer
      - PIE
      - Route
      - DHCPv4
      - DHCPv6
      - DHCPrefixDelegation
      - DHCPServer
      - DHCPServerStaticLease
      - IPv6AcceptRA
      - IPv6SendRA
      - IPv6Prefix
      - IPv6Pref64Prefix
      - IPv6RoutePrefix
      - LLDP
      - Bridge
      - BridgeFDB
      - BridgeMDB
      - BridgeVLAN
      - CAN
      - IPoIB
      - SR-IOV
    var_suffix: NETWORK
    dir_map: network
  netdev:
    sections:
      - Match
      - NetDev
      - VLAN
      - MACVLAN
      - MACVTap
      - IPVlan
      - IPVTap
      - VXLAN
      - MACsec
      - MACsecReceiveChannel
      - MACsecReceiveAssociation
      - MACsecTransmitAssociation
      - Tunnel
      - VTI
      - VTI6
      - GRE
      - GRETAP
      - IP6GRE
      - IP6GRETAP
      - L2TP
      - L2TPSession
      - Geneve
      - FooOverUDP
      - BareUDP
      - Bond
      - Bridge
      - VRF
      - VXCAN
      - WLAN
      - WireGuard
      - WireGuardPeer
      - BatmanAdvanced
      - IPoIB
      - Tun
      - Tap
      - Peer
      - HSR
      - Xfrm
    var_suffix: NETDEV
    dir_map: network

# must update vars_systemd_unit.tasks in sequence too
SYSTEMD_UNITTYPES_ALL: "{{ SYSTEMD_TYPE_CONFIG.keys() | list }}"

SYSTEMD_UNITS_DEFAULT:
  Description: "{{ NAME }}"
  DefaultDependencies: true

SYSTEMD_SERVICES_DEFAULT_BASE:
  Type: simple
  Restart: on-failure
  RestartSec: 5

SYSTEMD_SERVICES_DEFAULT: >-
  {{ SYSTEMD_SERVICES_DEFAULT_BASE
     | combine({'EnvironmentFile': '-' ~ DIR ~ '/env'}
       if (DIR is defined and ((ENV is defined and (ENV is mapping or (ENV is boolean and ENV))) or ENV_LIST is defined))
       else {}) }}

SYSTEMD_INSTALLS_DEFAULT:
  WantedBy: "{{ 'multi-user.target' if SYSTEMD_SCOPE == 'system' else 'default.target' }}"
