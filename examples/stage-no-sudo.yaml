---
# Render system-scope artifacts over SSH without privilege escalation or
# activation, on hosts whose deployment parents are user-writable (e.g.
# nanomachine's /etc/opt). Generic sibling of examples/nfs/stage-no-sudo.yaml.
#
# JSON/YAML booleans matter: BECOME='False' as a string is truthy in the
# legacy policy filter. Explicitly suppress both policy and Ansible become;
# the policy's automatic permission check inspects the controller, not SSH.
BECOME: false
ansible_become: false
USERMODE: false
PKGS_BYPASS: true
APT_BYPASS: true
MODULES_BYPASS: true
BINS_RUN_BYPASS: true
SYSTEMD_THUNK_BYPASS: true
GLOBAL_BINS_BYPASS: true
