---
ARCH: "{{INSTANCE}}"
#noauth: true
MULTISTRAP_REPOS:
- name: debian
  # centralized in vars/common.yaml (APT_DEFAULT_MIRROR); kernel.org measured
  # ~450kB/s/stream from this network vs ~15-22MB/s via deb.debian.org
  source: "{{APT_DEFAULT_MIRROR}}"
  suite: unstable
  keyring: debian-archive-keyring
  pkg_sets:
  - BASE
  - AUDIO
  - BT
  #- CEPH
  - DOCKER
  - JACK
  - MEDIA
  - VAAPI
  - POSTGRES
  #- RYGEL
  #- RYGEL_X
  # systemd is an adequate avahi replacement these days
  #- AVAHI
  #- AVAHI_X
  - WORKSTATION
  #- WORKSTATION_KDE_BASE
  #- WORKSTATION_KDE
  #- WORKSTATION_MATE
  - DEVEL
  - DEBDEV
  - AUDIO_X
  - BT_X
  - JACK_PLUGINS
  - JACK_X
  - MEDIA_X
  - WORKSTATION_WAYLAND
  - XPRA
  - MOPIDY
  pkgs: []
  #- mumble-server
  components:
  - main
  - contrib
  - non-free
- name: archive
  source: http://archive.voodoowarez.com/debian/
  suite: archive
  pkgs: []
  #- linux-image-amd64
  #- linux-headers-amd64
