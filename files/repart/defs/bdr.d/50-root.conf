# bdr flavor: online BlockDeviceReplace= migration — the running
# single-device btrfs root is live-migrated onto this partition via
# BTRFS_IOC_DEV_REPLACE (`btrfs replace`): blocks copied, device-id swapped
# atomically while mounted, then grown to fill. No Format=/CopyFiles= here
# (incompatible with BlockDeviceReplace=). Subvolumes come from the source
# fs; the default subvolume is set post-migrate by slot.sh
# (DefaultSubvolume= would need --offline, the opposite of BDR).
# Replaces universal.d/50-root.conf wholesale.
[Partition]
Type=root
Label=root
BlockDeviceReplace=/
GrowFileSystem=yes
SizeMinBytes=8G
