# format flavor: fresh btrfs with dated OS/home slots (superbfowle scheme,
# owned by the repart kit). Replaces universal.d/50-root.conf wholesale.
#
# MakeDirectories= MUST list every Subvolumes= path (the pairing is
# load-bearing): offline, repart stages the dirs into mkfs's --rootdir and
# flips them into subvolumes via `--subvol`. Without the pre-staged dir,
# mkfs canonicalizes the path against the HOST and dies with
#   "could not get canonical path of '/os/...': No such file or directory"
# (verified empirically against btrfs-progs 7.0; nested paths themselves
# are fine — only missing dirs fail).
#
# Tokens — stamped at RUN time by stamp.sh, never at render time:
#   @ARCH@  debian-style arch (stamp.sh maps uname -m; override REPART_ARCH)
#   @DATE@  YYYYMMDD (override REPART_DATE)
# No SizeMaxBytes -> root grows by weight into everything the fixed
# partitions before it don't claim.
[Partition]
Type=root
Format=btrfs
Label=root
MakeDirectories=/os/superbfowle/@ARCH@/@DATE@ /home/superbfowle/@DATE@
Subvolumes=/os/superbfowle/@ARCH@/@DATE@ /home/superbfowle/@DATE@
DefaultSubvolume=/os/superbfowle/@ARCH@/@DATE@
GrowFileSystem=yes
SizeMinBytes=8G

