# Universal layout, file 3/4: fixed-size swap BEFORE root. Fresh formats
# behave the same either way (repart computes final sizes, then lays out),
# but on LATER disk growth (VPS resize, bigger image) only the LAST
# partition can absorb the new tail — repart will not move swap. So root
# stays last/growable. @SWAP@ is stamped at run time by stamp.sh via
# REPART_SED (e.g. REPART_SED='s|@SWAP@|4G|g').
[Partition]
Type=swap
Format=swap
Label=swap
SizeMinBytes=@SWAP@
SizeMaxBytes=@SWAP@
