# Universal layout, file 1/4: 1MiB BIOS Boot Partition — grub-on-BIOS/GPT
# embeds core.img here (the post-MBR gap is not usable on GPT). Harmless
# (1MiB, unused) on UEFI-only firmware. Raw GUID: repart has no type alias.
[Partition]
