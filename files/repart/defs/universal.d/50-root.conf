# Universal layout, file 4/4: root BASE. Always overlaid by a flavor's
# 50-root.conf (format.d for fresh btrfs with dated slots, bdr.d for online
# BlockDeviceReplace= — the two are mechanically exclusive: the fs-move IS
# the population, and DefaultSubvolume= needs --offline while BDR is online).
# Direct use (no flavor) yields a plain unformatted root partition.
[Partition]
Type=root
Label=root
SizeMinBytes=8G
