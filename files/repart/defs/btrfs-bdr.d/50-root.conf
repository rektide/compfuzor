# Online BlockDeviceReplace= migrate profile: the running single-device
# btrfs root is live-migrated onto this partition via BTRFS_IOC_DEV_REPLACE
# (`btrfs replace`) — every block copied, device-id atomically swapped while
# mounted, then grown to fill. No Format=/CopyBlocks=/CopyFiles= here: the fs
# move IS the population. Subvolumes come from the source fs (none declared);
# the default subvolume is set post-migrate by slot.sh (DefaultSubvolume=
# would need --offline=yes, the opposite of BDR).
[Partition]
Type=root
Label=root
BlockDeviceReplace=/
SizeMinBytes=8G
