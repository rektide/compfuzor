# btrfs root with dated OS/home slots (the superbfowle scheme, owned by the
# repart kit). Tokens — stamped at RUN time by stamp.sh, never at render time:
#   @ARCH@  debian-style arch (stamp.sh maps uname -m; override REPART_ARCH)
#   @DATE@  YYYYMMDD (override REPART_DATE)
# No SizeMaxBytes -> grows by weight to fill everything the swap partition
# (fixed, below) does not claim.
[Partition]
Type=root
Format=btrfs
Label=root
Subvolumes=/os/superbfowle/@ARCH@/@DATE@ /home/superbfowle/@DATE@
DefaultSubvolume=/os/superbfowle/@ARCH@/@DATE@
GrowFileSystem=yes
SizeMinBytes=8G
