#### Debian installer preseed — unattended btrfs root + swap partition
####
#### Serve this over HTTP and point the installer at it with
####   INSTALLER_PRESEED_URL=http://<host>/preseed.cfg
#### (debinst-kexec.srv.pb passes that into the kexec kernel cmdline as url=...).
####
#### WHEN THINGS RUN (read pivot/btrfs discussion):
####   partman/early_command  -> BEFORE partitioning (not used here)
####   partman recipe below   -> creates the partitions
####   base install           -> installs into the btrfs TOP-LEVEL subvol (id 5)
####   preseed/late_command   -> END of install, target mounted at /target;
####                             we reshape into @ / @home here
####
#### EDIT THE PLACEHOLDERS marked CHANGEME before serving.

### Localization
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network — handled by the kexec cmdline (debinst-kexec netcfg/*).
### Leave these so the installer does not re-prompt.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string CHANGEME-hostname
d-i netcfg/get_domain string
d-i netcfg/hostname string CHANGEME-hostname

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Clock / timezone
d-i clock-setup/utc boolean true
d-i time/zone string America/New_York
d-i clock-setup/ntp boolean true

### Accounts — root login disabled, one sudo user with an SSH key (SSH-only box).
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string CHANGEME Name
d-i passwd/username string CHANGEME-user
# Prefer a hashed password (mkpasswd -m sha-512). Leave locked + rely on SSH key.
d-i passwd/user-password-crypted password CHANGEME-or-remove-for-locked
d-i user-setup/allow-password-weak boolean false
d-i user-setup/encrypt-home boolean false

############################################################
### Partitioning
###
### GPT layout, BIOS-boot (SeaBIOS KVM VPS) via a 1MiB bios_grub partition.
### *** If your VPS is UEFI: replace the bios_grub line with an ESP — see note. ***
###
### Sizes are min/priority/max in MB. A FIXED max (not -1) is what leaves the
### rest of the disk UNALLOCATED, so we do not eat the whole drive.
###   - swap : SWAP_MB fixed   (CHANGEME — "significant" per your ask)
###   - root : ROOT_MB fixed   (CHANGEME)
###   - free : everything past root stays unpartitioned for later use
############################################################
d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string regular
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman/alignment string optimal

d-i partman-auto/expert_recipe string                         \
      btrfs-swap-free ::                                       \
              1 1 1 free                                       \
                      $gptonly{ }                              \
                      $primary{ } method{ biosgrub }           \
              .                                                \
              8192 8192 8192 linux-swap                        \
                      $primary{ } method{ swap } format{ }     \
              .                                                \
              40960 40960 40960 btrfs                          \
                      $primary{ } method{ format } format{ }   \
                      use_filesystem{ } filesystem{ btrfs }    \
                      mountpoint{ / }                          \
              .
# ^ swap = 8192 MB, root = 40960 MB (40 GiB). CHANGEME to taste.
#   The fixed max on root is deliberate: it leaves the remaining disk free.
#
# UEFI variant: swap the bios_grub stanza for an ESP:
#       512 512 512 fat32
#               $primary{ } method{ efi } format{ }
#       .

d-i partman-basicfilesystems/no_swap boolean false
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-btrfs/no_subvolumes boolean true

### Base system
d-i base-installer/install-recommends boolean false
d-i base-installer/kernel/image string linux-image-amd64

### Apt
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean false
d-i apt-setup/contrib boolean false

### Package selection
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string btrfs-progs openssh-server sudo
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/vda

### Finish
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean false

############################################################
### late_command — reshape the top-level install into @ / @home,
### pin subvol=@ in fstab + grub, drop the SSH key for the user.
###
### Runs with the new system mounted at /target. We fetch the reshape
### script from the same place that served this preseed.
### CHANGEME: PRESEED_BASE must match where preseed.cfg lives.
############################################################
d-i preseed/late_command string \
    in-target sh -c 'apt-get -y install btrfs-progs >/dev/null 2>&1 || true'; \
    PRESEED_BASE=http://CHANGEME-host/debinst; \
    SSH_KEY_URL=http://CHANGEME-host/debinst/authorized_keys; \
    wget -O /tmp/btrfs-subvol-reshape.sh "$PRESEED_BASE/btrfs-subvol-reshape.sh" && \
      sh /tmp/btrfs-subvol-reshape.sh /target; \
    mkdir -p /target/home/CHANGEME-user/.ssh && \
      wget -O /target/home/CHANGEME-user/.ssh/authorized_keys "$SSH_KEY_URL" && \
      in-target chown -R CHANGEME-user:CHANGEME-user /home/CHANGEME-user/.ssh && \
      in-target chmod 700 /home/CHANGEME-user/.ssh && \
      in-target chmod 600 /home/CHANGEME-user/.ssh/authorized_keys
